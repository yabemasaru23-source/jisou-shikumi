<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="丘の上で社長が虫めがねを持ち、大きなコインを見ている。コインの表には「クセ」、ひっくり返した裏には「強み」と書いてある。くるりんが「クセの裏に、強みあり！」と言っている">
  <rect width="800" height="320" rx="24" fill="var(--sky, #dbe7fb)"/>
  <!-- くも -->
  <g fill="var(--surface, #fff)" opacity=".85">
    <ellipse cx="150" cy="56" rx="44" ry="15"/><ellipse cx="184" cy="47" rx="28" ry="15"/>
    <ellipse cx="712" cy="40" rx="38" ry="12"/><ellipse cx="740" cy="33" rx="24" ry="12"/>
  </g>
  <!-- 看板 -->
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="290" y="16" width="220" height="36" rx="18" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="400" y="40" font-size="16" fill="var(--ink, #1d2540)">🔍 自分のクセを見つけよう</text>
  </g>
  <!-- 丘 -->
  <ellipse cx="400" cy="332" rx="470" ry="72" fill="var(--leaf, #2f8f6b)" opacity=".8"/>
  <!-- 社長 -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round">
    <path d="M302 262 V232 Q302 206 330 206 Q358 206 358 232 V262 Z" fill="var(--sky-ink, #6f86b8)"/>
    <circle cx="330" cy="184" r="20" fill="var(--surface, #fff)"/>
  </g>
  <g fill="var(--ink, #1d2540)"><circle cx="323" cy="181" r="2.2"/><circle cx="337" cy="181" r="2.2"/></g>
  <path d="M324 190 Q330 196 336 190" fill="none" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linecap="round"/>
  <!-- ハート -->
  <path d="M0 4 C-8 -4 -4 -10 0 -5 C4 -10 8 -4 0 4 Z" transform="translate(296 158) scale(1.5)" fill="var(--warm, #c0583a)"/>
  <!-- 虫めがね -->
  <g stroke="var(--ink, #1d2540)" stroke-linecap="round">
    <line x1="352" y1="226" x2="380" y2="208" stroke-width="3"/>
    <line x1="380" y1="208" x2="390" y2="198" stroke-width="6"/>
    <circle cx="400" cy="188" r="14" fill="var(--surface, #fff)" fill-opacity=".7" stroke-width="3"/>
  </g>
  <!-- コイン：表 -->
  <circle cx="500" cy="166" r="58" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="3"/>
  <circle cx="500" cy="166" r="47" fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="2" stroke-dasharray="3 7" stroke-linecap="round"/>
  <!-- コイン：裏 -->
  <circle cx="680" cy="166" r="58" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="3"/>
  <circle cx="680" cy="166" r="47" fill="none" stroke="#1d2540" stroke-width="2"/>
  <!-- ひっくり返す矢印 -->
  <path d="M552 118 Q590 82 628 118" fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="3" stroke-linecap="round"/>
  <path d="M618 117 L628 118 L627 108" fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- きらきら -->
  <g fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="1.5" stroke-linejoin="round">
    <path d="M0 -9 L2.5 -2.5 L9 0 L2.5 2.5 L0 9 L-2.5 2.5 L-9 0 L-2.5 -2.5 Z" transform="translate(752 104)"/>
    <path d="M0 -9 L2.5 -2.5 L9 0 L2.5 2.5 L0 9 L-2.5 2.5 L-9 0 L-2.5 -2.5 Z" transform="translate(612 224) scale(.8)"/>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <text x="590" y="72" font-size="13" fill="var(--ink-soft, #545c78)">ひっくり返すと</text>
    <text x="500" y="174" font-size="22" fill="var(--ink, #1d2540)">クセ</text>
    <text x="680" y="174" font-size="22" fill="#1d2540">強み</text>
    <text x="500" y="248" font-size="13" fill="var(--ink-soft, #545c78)">おもて</text>
    <text x="680" y="248" font-size="13" fill="var(--ink-soft, #545c78)">うら</text>
  </g>
  <!-- くるりん -->
  <g transform="translate(40 180) scale(.9)">
    <g transform="translate(60 62)">
      <g fill="var(--sun, #f2b01e)">
        <rect x="-9" y="-54" width="18" height="22" rx="6"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(45)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(90)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(135)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(180)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(225)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(270)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(315)"/>
      </g>
      <circle r="40" fill="var(--sun, #f2b01e)"/><circle r="31" fill="#ffd866"/>
      <circle cx="-12" cy="-4" r="5" fill="#1d2540"/><circle cx="12" cy="-4" r="5" fill="#1d2540"/>
      <circle cx="-10.5" cy="-6" r="1.8" fill="#fff"/><circle cx="13.5" cy="-6" r="1.8" fill="#fff"/>
      <ellipse cx="-21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/><ellipse cx="21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/>
      <path d="M-9 9 Q0 19 9 9" fill="none" stroke="#1d2540" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <path d="M40 104 h168 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-110 l-14 14 l-2 -14 h-42 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="124" y="138" font-size="15" text-anchor="middle" fill="var(--ink, #1d2540)">クセの裏に、強みあり！</text>
  </g>
</svg>
