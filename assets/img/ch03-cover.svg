<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="書類の山と通知だらけのパソコンで散らかった机、急いで回る壁の時計。床にはA・B・Cの3つの箱が用意されている。くるりんが「まずは時間と机のお片づけ！」と言っている">
  <rect width="800" height="320" rx="24" fill="var(--sky, #dbe7fb)"/>
  <!-- 床 -->
  <rect x="24" y="258" width="752" height="48" rx="10" fill="var(--sun-soft, #fdf0cc)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
  <!-- 見出しの札 -->
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="320" y="20" width="200" height="36" rx="18" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="420" y="44" font-size="16" fill="var(--ink, #1d2540)">🗂 お片づけ前の机</text>
  </g>
  <!-- 壁の時計 -->
  <g transform="translate(640 92)">
    <circle r="50" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="3"/>
    <g stroke="var(--ink, #1d2540)" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-42" x2="0" y2="-34"/><line x1="42" y1="0" x2="34" y2="0"/>
      <line x1="0" y1="42" x2="0" y2="34"/><line x1="-42" y1="0" x2="-34" y2="0"/>
      <line x1="0" y1="0" x2="0" y2="-28" stroke-width="4"/><line x1="0" y1="0" x2="20" y2="10"/>
    </g>
    <circle r="4" fill="var(--warm, #c0583a)"/>
    <!-- 急いでいる線 -->
    <g fill="none" stroke="var(--warm, #c0583a)" stroke-width="3" stroke-linecap="round">
      <path d="M-62 -30 Q-70 0 -62 30"/><path d="M62 -30 Q70 0 62 30"/>
      <path d="M-74 -20 Q-80 0 -74 20"/><path d="M74 -20 Q80 0 74 20"/>
    </g>
  </g>
  <!-- 机 -->
  <g stroke="var(--ink, #1d2540)" stroke-width="3" stroke-linecap="round">
    <line x1="292" y1="212" x2="292" y2="258"/><line x1="548" y1="212" x2="548" y2="258"/>
  </g>
  <rect x="270" y="196" width="300" height="16" rx="5" fill="var(--sky-ink, #6f86b8)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
  <!-- 書類の山（左） -->
  <g fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round">
    <rect x="288" y="180" width="64" height="16" rx="2"/>
    <rect x="292" y="164" width="60" height="16" rx="2" transform="rotate(-4 322 172)"/>
    <rect x="286" y="148" width="62" height="16" rx="2" transform="rotate(3 317 156)"/>
    <rect x="292" y="132" width="58" height="16" rx="2" transform="rotate(-6 321 140)"/>
    <rect x="290" y="116" width="60" height="16" rx="2" transform="rotate(5 320 124)"/>
  </g>
  <!-- パソコン -->
  <rect x="368" y="138" width="88" height="54" rx="5" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
  <path d="M356 196 L468 196 L460 190 L364 190 Z" fill="var(--ink-soft, #545c78)" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round"/>
  <g fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="1.5">
    <rect x="376" y="146" width="20" height="18" rx="2" transform="rotate(-8 386 155)"/>
    <rect x="400" y="160" width="20" height="18" rx="2" transform="rotate(6 410 169)"/>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <circle cx="452" cy="140" r="13" fill="var(--warm, #c0583a)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="452" y="145" font-size="13" fill="#fff">99</text>
  </g>
  <!-- 書類の山（右）とカップ -->
  <g fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round">
    <rect x="486" y="180" width="58" height="16" rx="2"/>
    <rect x="488" y="164" width="56" height="16" rx="2" transform="rotate(5 516 172)"/>
    <rect x="484" y="148" width="58" height="16" rx="2" transform="rotate(-4 513 156)"/>
    <path d="M552 196 V176 H568 V196 Z"/>
  </g>
  <!-- ひらひら飛ぶ紙 -->
  <g fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round">
    <rect x="270" y="70" width="30" height="22" rx="2" transform="rotate(-18 285 81)"/>
    <rect x="500" y="88" width="30" height="22" rx="2" transform="rotate(14 515 99)"/>
    <rect x="420" y="232" width="30" height="20" rx="2" transform="rotate(10 435 242)"/>
  </g>
  <g fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="2" stroke-linecap="round">
    <path d="M262 96 Q270 102 264 110"/><path d="M540 116 Q534 122 540 130"/>
  </g>
  <!-- A・B・Cの箱 -->
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <text x="680" y="196" font-size="13" fill="var(--ink-soft, #545c78)">仕分けの3つの箱</text>
    <rect x="604" y="214" width="48" height="44" rx="5" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <text x="628" y="243" font-size="20" fill="#1d2540">A</text>
    <rect x="656" y="214" width="48" height="44" rx="5" fill="var(--leaf-soft, #dcf1e8)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <text x="680" y="243" font-size="20" fill="var(--ink, #1d2540)">B</text>
    <rect x="708" y="214" width="48" height="44" rx="5" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <text x="732" y="243" font-size="20" fill="var(--ink, #1d2540)">C</text>
  </g>
  <!-- くるりん -->
  <g transform="translate(40 180) scale(.9)">
    <g transform="translate(60 62)">
      <g fill="var(--sun, #f2b01e)">
        <rect x="-9" y="-54" width="18" height="22" rx="6"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(45)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(90)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(135)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(180)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(225)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(270)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(315)"/>
      </g>
      <circle r="40" fill="var(--sun, #f2b01e)"/><circle r="31" fill="#ffd866"/>
      <circle cx="-12" cy="-4" r="5" fill="#1d2540"/><circle cx="12" cy="-4" r="5" fill="#1d2540"/>
      <circle cx="-10.5" cy="-6" r="1.8" fill="#fff"/><circle cx="13.5" cy="-6" r="1.8" fill="#fff"/>
      <ellipse cx="-21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/><ellipse cx="21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/>
      <path d="M-9 9 Q0 19 9 9" fill="none" stroke="#1d2540" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <path d="M44 104 h192 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-130 l-14 14 l-2 -14 h-46 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="140" y="138" font-size="15" text-anchor="middle" fill="var(--ink, #1d2540)">まずは時間と机のお片づけ！</text>
  </g>
</svg>
