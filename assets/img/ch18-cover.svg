<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="7つの段がだんだん高くなる階段。いちばん下の段で転校生とクラスの子が「はじめまして」とあいさつし、まん中の段で「あそぼう！」とボールで遊び、いちばん上の段では手をつないで「この子、いい子だよ」とまわりに紹介している。段には「知る・好き・信じる・ためす・決める・なかよし・紹介」と書いてある。くるりんが「一段ずつ、なかよく！」と言っている">
  <rect width="800" height="320" rx="24" fill="var(--sky, #dbe7fb)"/>
  <!-- くも -->
  <g fill="var(--surface, #fff)" opacity=".85">
    <ellipse cx="330" cy="48" rx="44" ry="15"/><ellipse cx="364" cy="39" rx="28" ry="15"/>
    <ellipse cx="560" cy="44" rx="36" ry="12"/><ellipse cx="586" cy="37" rx="22" ry="12"/>
  </g>
  <!-- 地面 -->
  <path d="M0 256 H800 V296 a24 24 0 0 1 -24 24 H24 a24 24 0 0 1 -24 -24 Z" fill="var(--leaf-soft, #dcf1e8)"/>
  <!-- 7つの段 -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linejoin="round">
    <rect x="236" y="268" width="76" height="40" rx="6" fill="var(--sun-soft, #fdf0cc)"/>
    <rect x="314" y="252" width="76" height="56" rx="6" fill="var(--sun-soft, #fdf0cc)"/>
    <rect x="392" y="236" width="76" height="72" rx="6" fill="var(--sun-soft, #fdf0cc)"/>
    <rect x="470" y="220" width="76" height="88" rx="6" fill="var(--sun-soft, #fdf0cc)"/>
    <rect x="548" y="204" width="76" height="104" rx="6" fill="var(--sun-soft, #fdf0cc)"/>
    <rect x="626" y="188" width="76" height="120" rx="6" fill="var(--sun-soft, #fdf0cc)"/>
    <rect x="704" y="172" width="76" height="136" rx="6" fill="var(--sun, #f2b01e)"/>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle" font-size="12" fill="var(--ink, #1d2540)">
    <text x="274" y="288">知る</text>
    <text x="352" y="272">好き</text>
    <text x="430" y="256">信じる</text>
    <text x="508" y="240">ためす</text>
    <text x="586" y="224">決める</text>
    <text x="664" y="208">なかよし</text>
    <text x="742" y="192" fill="#1d2540">紹介</text>
  </g>
  <!-- 段の上のしるし -->
  <g font-size="18" text-anchor="middle">
    <text x="352" y="242">💗</text>
    <text x="430" y="226">🤝</text>
    <text x="586" y="194">✍️</text>
    <text x="664" y="178">🔁</text>
  </g>
  <!-- 子どもたち（転校生＝赤、クラスの子＝緑） -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round">
    <path d="M240 268 V248 Q240 232 256 232 Q272 232 272 248 V268 Z" fill="var(--warm, #c0583a)"/>
    <circle cx="256" cy="218" r="12" fill="var(--surface, #fff)"/>
    <path d="M278 268 V248 Q278 232 294 232 Q310 232 310 248 V268 Z" fill="var(--leaf, #2f8f6b)"/>
    <circle cx="294" cy="218" r="12" fill="var(--surface, #fff)"/>
    <path d="M474 220 V200 Q474 184 490 184 Q506 184 506 200 V220 Z" fill="var(--warm, #c0583a)"/>
    <circle cx="490" cy="170" r="12" fill="var(--surface, #fff)"/>
    <path d="M510 220 V200 Q510 184 526 184 Q542 184 542 200 V220 Z" fill="var(--leaf, #2f8f6b)"/>
    <circle cx="526" cy="170" r="12" fill="var(--surface, #fff)"/>
    <path d="M708 172 V152 Q708 136 724 136 Q740 136 740 152 V172 Z" fill="var(--warm, #c0583a)"/>
    <circle cx="724" cy="122" r="12" fill="var(--surface, #fff)"/>
    <path d="M744 172 V152 Q744 136 760 136 Q776 136 776 152 V172 Z" fill="var(--leaf, #2f8f6b)"/>
    <circle cx="760" cy="122" r="12" fill="var(--surface, #fff)"/>
    <!-- ボール -->
    <circle cx="508" cy="146" r="7" fill="var(--sun, #f2b01e)"/>
  </g>
  <!-- 手をつなぐ -->
  <path d="M736 152 Q742 158 748 152" fill="none" stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- 顔 -->
  <g fill="var(--ink, #1d2540)">
    <circle cx="252" cy="216" r="1.8"/><circle cx="260" cy="216" r="1.8"/>
    <circle cx="290" cy="216" r="1.8"/><circle cx="298" cy="216" r="1.8"/>
    <circle cx="486" cy="168" r="1.8"/><circle cx="494" cy="168" r="1.8"/>
    <circle cx="522" cy="168" r="1.8"/><circle cx="530" cy="168" r="1.8"/>
    <circle cx="720" cy="120" r="1.8"/><circle cx="728" cy="120" r="1.8"/>
    <circle cx="756" cy="120" r="1.8"/><circle cx="764" cy="120" r="1.8"/>
  </g>
  <g fill="none" stroke="var(--ink, #1d2540)" stroke-width="1.8" stroke-linecap="round">
    <path d="M253 223 H259"/><path d="M291 223 H297"/>
    <path d="M486 174 Q490 178 494 174"/><path d="M522 174 Q526 178 530 174"/>
    <path d="M720 126 Q724 130 728 126"/><path d="M756 126 Q760 130 764 126"/>
  </g>
  <!-- ハート -->
  <path d="M742 104 C730 94 734 84 742 90 C750 84 754 94 742 104 Z" fill="var(--warm, #c0583a)" stroke="var(--ink, #1d2540)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- セリフ -->
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle" font-size="12" fill="var(--ink, #1d2540)">
    <rect x="226" y="172" width="100" height="26" rx="13" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="276" y="190">はじめまして</text>
    <rect x="468" y="104" width="80" height="26" rx="13" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="508" y="122">あそぼう！</text>
    <rect x="590" y="64" width="128" height="26" rx="13" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <path d="M700 90 L712 104" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linecap="round"/>
    <text x="654" y="82">この子、いい子だよ</text>
  </g>
  <!-- くるりん -->
  <g transform="translate(18 176) scale(.9)">
    <g transform="translate(60 62)">
      <g fill="var(--sun, #f2b01e)">
        <rect x="-9" y="-54" width="18" height="22" rx="6"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(45)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(90)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(135)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(180)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(225)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(270)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(315)"/>
      </g>
      <circle r="40" fill="var(--sun, #f2b01e)"/><circle r="31" fill="#ffd866"/>
      <circle cx="-12" cy="-4" r="5" fill="#1d2540"/><circle cx="12" cy="-4" r="5" fill="#1d2540"/>
      <circle cx="-10.5" cy="-6" r="1.8" fill="#fff"/><circle cx="13.5" cy="-6" r="1.8" fill="#fff"/>
      <ellipse cx="-21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/><ellipse cx="21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/>
      <path d="M-9 9 Q0 19 9 9" fill="none" stroke="#1d2540" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <path d="M40 104 h168 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-110 l-14 14 l-2 -14 h-42 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="124" y="138" font-size="15" text-anchor="middle" fill="var(--ink, #1d2540)">一段ずつ、なかよく！</text>
  </g>
</svg>
