<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 344" role="img" aria-label="「〜を目指す」と「〜になっている」のちがい。左の目指す形は、道の先が雲にかくれて、どこまで行けばいいかわからない。例は、地域に信頼される会社を目指す。右のなっている形は、写真に撮れるくらいはっきり景色が見える。例は、町の人から介護のことならひだまりさんと名前で呼ばれている">
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <!-- 左：目指す -->
    <rect x="20" y="20" width="360" height="44" rx="14" fill="var(--surface, #fff)" stroke="var(--ink-soft, #545c78)" stroke-width="2.5"/>
    <text x="200" y="48" font-size="18" fill="var(--ink-soft, #545c78)">✕ 〜を目指す（方針）</text>
    <rect x="20" y="76" width="360" height="144" rx="14" fill="var(--sky, #dbe7fb)"/>
    <path d="M136 220 L188 132 H212 L264 220 Z" fill="var(--sky-ink, #6f86b8)" opacity=".45"/>
    <path d="M200 214 V196 M200 180 V164 M200 150 V138" stroke="var(--surface, #fff)" stroke-width="3" stroke-linecap="round"/>
    <g fill="var(--surface, #fff)">
      <ellipse cx="200" cy="120" rx="80" ry="26"/><ellipse cx="160" cy="106" rx="40" ry="20"/><ellipse cx="238" cy="104" rx="36" ry="18"/>
    </g>
    <text x="200" y="128" font-size="28" fill="var(--ink-soft, #545c78)">？</text>
    <text x="200" y="244" font-size="14" fill="var(--ink-soft, #545c78)">どこまで行けばいいか、わからない</text>
    <rect x="20" y="258" width="360" height="64" rx="14" fill="var(--surface, #fff)" stroke="var(--ink-soft, #545c78)" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="200" y="295" font-size="14" fill="var(--ink-soft, #545c78)">例：地域に信頼される会社を目指す</text>
    <!-- 矢印 -->
    <path d="M388 170 H410" stroke="var(--ink-soft, #545c78)" stroke-width="3" stroke-linecap="round"/>
    <path d="M402 162 L411 170 L402 178" fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 右：なっている -->
    <rect x="420" y="20" width="360" height="44" rx="14" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <text x="600" y="48" font-size="18" fill="#1d2540">◯ 〜になっている（完成した姿）</text>
    <rect x="420" y="76" width="360" height="144" rx="14" fill="var(--leaf-soft, #dcf1e8)"/>
    <!-- 写真 -->
    <rect x="520" y="84" width="160" height="128" rx="6" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <rect x="530" y="94" width="140" height="92" fill="var(--sky, #dbe7fb)"/>
    <circle cx="650" cy="112" r="10" fill="var(--sun, #f2b01e)"/>
    <path d="M530 186 Q575 150 620 166 Q650 156 670 162 V186 Z" fill="var(--leaf, #2f8f6b)" opacity=".85"/>
    <g stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round">
      <path d="M566 156 L586 138 L606 156 Z" fill="var(--warm, #c0583a)"/>
      <rect x="570" y="156" width="32" height="22" fill="var(--surface, #fff)"/>
    </g>
    <circle cx="552" cy="170" r="5" fill="var(--ink, #1d2540)"/><rect x="547" y="175" width="10" height="11" rx="4" fill="var(--ink, #1d2540)"/>
    <circle cx="624" cy="170" r="5" fill="var(--ink, #1d2540)"/><rect x="619" y="175" width="10" height="11" rx="4" fill="var(--ink, #1d2540)"/>
    <text x="600" y="204" font-size="12" fill="var(--ink, #1d2540)">📷 ひだまりさん</text>
    <text x="600" y="244" font-size="14" fill="var(--ink, #1d2540)">写真に撮れるくらい、はっきり見える</text>
    <rect x="420" y="258" width="360" height="64" rx="14" fill="var(--surface, #fff)" stroke="var(--leaf, #2f8f6b)" stroke-width="2.5"/>
    <text x="600" y="284" font-size="14" fill="var(--ink, #1d2540)">例：町の人から「介護のことなら、</text>
    <text x="600" y="306" font-size="14" fill="var(--ink, #1d2540)">ひだまりさん」と名前で呼ばれている</text>
  </g>
</svg>
