<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="文化祭でたこ焼き屋さんが3つ並んでいる。1組と2組はふつうの看板で、どこがちがうのかわからない。3組だけ「チーズたこ焼き・6個200円・待ち時間3分」と大きな看板を出し、お客さんが並んでいる。くるりんが「ちがいを、ひと目で！」と言っている">
  <rect width="800" height="320" rx="24" fill="var(--sky, #dbe7fb)"/>
  <!-- くも -->
  <g fill="var(--surface, #fff)" opacity=".85">
    <ellipse cx="150" cy="50" rx="44" ry="15"/><ellipse cx="184" cy="41" rx="28" ry="15"/>
    <ellipse cx="420" cy="40" rx="36" ry="12"/><ellipse cx="446" cy="33" rx="22" ry="12"/>
  </g>
  <!-- 地面 -->
  <path d="M0 256 H800 V296 a24 24 0 0 1 -24 24 H24 a24 24 0 0 1 -24 -24 Z" fill="var(--leaf-soft, #dcf1e8)"/>
  <!-- 3組へのスポットライト -->
  <path d="M640 0 L710 0 L790 256 L570 256 Z" fill="var(--sun, #f2b01e)" opacity=".2"/>
  <!-- 屋台の柱 -->
  <g stroke="var(--ink, #1d2540)" stroke-width="3" stroke-linecap="round">
    <line x1="258" y1="138" x2="258" y2="192"/><line x1="382" y1="138" x2="382" y2="192"/>
    <line x1="418" y1="138" x2="418" y2="192"/><line x1="542" y1="138" x2="542" y2="192"/>
    <line x1="588" y1="138" x2="588" y2="182"/><line x1="762" y1="138" x2="762" y2="182"/>
  </g>
  <!-- 屋根（しま模様） -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round">
    <rect x="248" y="110" width="144" height="30" rx="6" fill="var(--warm, #c0583a)"/>
    <rect x="408" y="110" width="144" height="30" rx="6" fill="var(--warm, #c0583a)"/>
    <rect x="578" y="110" width="194" height="30" rx="6" fill="var(--warm, #c0583a)"/>
  </g>
  <g fill="var(--surface, #fff)" opacity=".55">
    <rect x="272" y="112" width="24" height="26"/><rect x="320" y="112" width="24" height="26"/><rect x="368" y="112" width="12" height="26"/>
    <rect x="432" y="112" width="24" height="26"/><rect x="480" y="112" width="24" height="26"/><rect x="528" y="112" width="12" height="26"/>
    <rect x="602" y="112" width="24" height="26"/><rect x="650" y="112" width="24" height="26"/><rect x="698" y="112" width="24" height="26"/><rect x="746" y="112" width="14" height="26"/>
  </g>
  <!-- カウンター -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linejoin="round">
    <rect x="250" y="190" width="140" height="62" rx="8" fill="var(--sun-soft, #fdf0cc)"/>
    <rect x="410" y="190" width="140" height="62" rx="8" fill="var(--sun-soft, #fdf0cc)"/>
    <rect x="580" y="180" width="190" height="72" rx="8" fill="var(--sun-soft, #fdf0cc)"/>
  </g>
  <!-- たこ焼き -->
  <g fill="var(--warm, #c0583a)" stroke="var(--ink, #1d2540)" stroke-width="1.5">
    <circle cx="308" cy="184" r="6"/><circle cx="322" cy="184" r="6"/><circle cx="336" cy="184" r="6"/>
    <circle cx="468" cy="184" r="6"/><circle cx="482" cy="184" r="6"/><circle cx="496" cy="184" r="6"/>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <!-- 1組・2組の看板 -->
    <rect x="270" y="74" width="100" height="30" rx="8" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="320" y="94" font-size="14" fill="var(--ink, #1d2540)">1組 たこ焼き</text>
    <rect x="430" y="74" width="100" height="30" rx="8" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="480" y="94" font-size="14" fill="var(--ink, #1d2540)">2組 たこ焼き</text>
    <text x="320" y="226" font-size="12" fill="var(--ink, #1d2540)">心をこめて焼きます</text>
    <text x="480" y="226" font-size="12" fill="var(--ink, #1d2540)">少しだけ安い</text>
    <!-- 3組の大きな看板 -->
    <rect x="582" y="22" width="186" height="78" rx="14" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <text x="675" y="54" font-size="17" fill="#1d2540">3組 チーズたこ焼き</text>
    <text x="675" y="82" font-size="13" fill="#1d2540">6個200円・待ち時間3分</text>
    <text x="320" y="286" font-size="13" fill="var(--ink-soft, #545c78)">どこがちがうの？</text>
    <text x="480" y="286" font-size="13" fill="var(--ink-soft, #545c78)">どこがちがうの？</text>
  </g>
  <g stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linecap="round">
    <line x1="630" y1="100" x2="630" y2="110"/><line x1="720" y1="100" x2="720" y2="110"/>
  </g>
  <!-- 3組に並ぶお客さん -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round">
    <path d="M598 270 V250 Q598 234 614 234 Q630 234 630 250 V270 Z" fill="var(--leaf, #2f8f6b)"/>
    <circle cx="614" cy="220" r="12" fill="var(--surface, #fff)"/>
    <path d="M644 270 V250 Q644 234 660 234 Q676 234 676 250 V270 Z" fill="var(--sky-ink, #6f86b8)"/>
    <circle cx="660" cy="220" r="12" fill="var(--surface, #fff)"/>
    <path d="M690 270 V250 Q690 234 706 234 Q722 234 722 250 V270 Z" fill="var(--warm, #c0583a)"/>
    <circle cx="706" cy="220" r="12" fill="var(--surface, #fff)"/>
    <path d="M736 270 V250 Q736 234 752 234 Q768 234 768 250 V270 Z" fill="var(--leaf, #2f8f6b)"/>
    <circle cx="752" cy="220" r="12" fill="var(--surface, #fff)"/>
  </g>
  <g fill="var(--ink, #1d2540)">
    <circle cx="610" cy="218" r="1.8"/><circle cx="618" cy="218" r="1.8"/>
    <circle cx="656" cy="218" r="1.8"/><circle cx="664" cy="218" r="1.8"/>
    <circle cx="702" cy="218" r="1.8"/><circle cx="710" cy="218" r="1.8"/>
    <circle cx="748" cy="218" r="1.8"/><circle cx="756" cy="218" r="1.8"/>
  </g>
  <g fill="none" stroke="var(--ink, #1d2540)" stroke-width="1.8" stroke-linecap="round">
    <path d="M610 224 Q614 228 618 224"/><path d="M656 224 Q660 228 664 224"/><path d="M702 224 Q706 228 710 224"/><path d="M748 224 Q752 228 756 224"/>
  </g>
  <!-- くるりん -->
  <g transform="translate(30 180) scale(.9)">
    <g transform="translate(60 62)">
      <g fill="var(--sun, #f2b01e)">
        <rect x="-9" y="-54" width="18" height="22" rx="6"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(45)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(90)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(135)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(180)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(225)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(270)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(315)"/>
      </g>
      <circle r="40" fill="var(--sun, #f2b01e)"/><circle r="31" fill="#ffd866"/>
      <circle cx="-12" cy="-4" r="5" fill="#1d2540"/><circle cx="12" cy="-4" r="5" fill="#1d2540"/>
      <circle cx="-10.5" cy="-6" r="1.8" fill="#fff"/><circle cx="13.5" cy="-6" r="1.8" fill="#fff"/>
      <ellipse cx="-21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/><ellipse cx="21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/>
      <path d="M-9 9 Q0 19 9 9" fill="none" stroke="#1d2540" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <path d="M40 104 h168 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-110 l-14 14 l-2 -14 h-42 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="124" y="138" font-size="15" text-anchor="middle" fill="var(--ink, #1d2540)">ちがいを、ひと目で！</text>
  </g>
</svg>
