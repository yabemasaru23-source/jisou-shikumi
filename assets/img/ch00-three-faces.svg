<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-label="社長の3つの顔。現場の人は自分の手でお客様に届ける、まとめ役は人と仕事をまとめて今日一日を回す、未来をつくる人は会社の行き先を決めて仕組みをつくる。社長の1週間の時間のうち、未来をつくる人の時間を3分の1以上にするのがめざす形">
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <!-- カード -->
    <rect x="35" y="20" width="230" height="196" rx="18" fill="var(--surface, #fff)" stroke="var(--ink-soft, #545c78)" stroke-width="2"/>
    <rect x="285" y="20" width="230" height="196" rx="18" fill="var(--surface, #fff)" stroke="var(--ink-soft, #545c78)" stroke-width="2"/>
    <rect x="535" y="20" width="230" height="196" rx="18" fill="var(--sun-soft, #fdf0cc)" stroke="var(--sun, #f2b01e)" stroke-width="3"/>
    <!-- 顔 -->
    <g fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5">
      <circle cx="150" cy="78" r="38"/><circle cx="400" cy="78" r="38"/><circle cx="650" cy="78" r="38"/>
    </g>
    <path d="M113 68 Q150 52 187 68" fill="none" stroke="var(--warm, #c0583a)" stroke-width="6" stroke-linecap="round"/>
    <g fill="var(--ink, #1d2540)">
      <circle cx="138" cy="80" r="3.5"/><circle cx="162" cy="80" r="3.5"/>
      <circle cx="388" cy="76" r="3.5"/><circle cx="412" cy="76" r="3.5"/>
      <circle cx="638" cy="74" r="3.5"/><circle cx="662" cy="74" r="3.5"/>
    </g>
    <g fill="none" stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linecap="round">
      <path d="M142 96 H158"/>
      <path d="M390 92 Q400 98 410 92"/>
      <path d="M636 88 Q650 102 664 88"/>
    </g>
    <path d="M608 36 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- アイコン -->
    <g fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2">
      <circle cx="180" cy="108" r="17"/><circle cx="430" cy="108" r="17"/><circle cx="680" cy="108" r="17"/>
    </g>
    <g font-size="18">
      <text x="180" y="115">🔧</text><text x="430" y="115">📋</text><text x="680" y="115">🚀</text>
    </g>
    <!-- 名前と説明 -->
    <g font-size="19" fill="var(--ink, #1d2540)">
      <text x="150" y="152">現場の人</text><text x="400" y="152">まとめ役</text><text x="650" y="152">未来をつくる人</text>
    </g>
    <g font-size="13" fill="var(--ink-soft, #545c78)">
      <text x="150" y="178">自分の手で、</text><text x="150" y="198">お客様に届ける</text>
      <text x="400" y="178">人と仕事をまとめて、</text><text x="400" y="198">今日一日を回す</text>
      <text x="650" y="178">会社の行き先を決めて、</text><text x="650" y="198">仕組みをつくる</text>
    </g>
    <!-- 矢印 -->
    <g stroke="var(--ink-soft, #545c78)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M650 222 V260"/><path d="M641 250 L650 262 L659 250"/>
    </g>
    <!-- 時間の帯 -->
    <text x="35" y="258" font-size="14" text-anchor="start" fill="var(--ink, #1d2540)">社長の1週間の時間</text>
    <rect x="35" y="268" width="244" height="40" fill="var(--sky, #dbe7fb)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <rect x="279" y="268" width="243" height="40" fill="var(--leaf-soft, #dcf1e8)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <rect x="522" y="268" width="243" height="40" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="3"/>
    <g font-size="15" fill="#1d2540">
      <text x="157" y="293">🔧 現場</text><text x="400" y="293">📋 まとめ</text><text x="643" y="293">🚀 未来 1/3以上</text>
    </g>
    <text x="400" y="340" font-size="15" fill="var(--ink, #1d2540)">めざすのは、未来をつくる時間を 全体の3分の1以上に</text>
  </g>
</svg>
