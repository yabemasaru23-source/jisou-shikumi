<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="部屋のまんなかに大きな本「会社の取扱説明書」が立ち、右のボードには「毎月の請求」「送迎ルート」「はじめての日の迎え入れ」の仕事のレシピのカードがとめてある。くるりんが「読めばわかる会社にしよう！」と言っている">
  <rect width="800" height="320" rx="24" fill="var(--sky, #dbe7fb)"/>
  <!-- 床 -->
  <rect x="24" y="258" width="752" height="48" rx="10" fill="var(--sun-soft, #fdf0cc)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
  <line x1="36" y1="272" x2="764" y2="272" stroke="var(--sun, #f2b01e)" stroke-width="2" stroke-linecap="round"/>
  <!-- 大きな本：会社の取扱説明書 -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linejoin="round">
    <rect x="290" y="74" width="168" height="186" rx="8" fill="var(--surface, #fff)"/>
    <rect x="262" y="66" width="26" height="194" rx="8" fill="var(--warm, #c0583a)"/>
    <rect x="280" y="66" width="168" height="186" rx="8" fill="var(--sun, #f2b01e)"/>
    <rect x="298" y="90" width="132" height="66" rx="10" fill="var(--surface, #fff)"/>
  </g>
  <g fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="1.5" stroke-linecap="round">
    <line x1="452" y1="100" x2="452" y2="250"/>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <text x="364" y="117" font-size="15" fill="var(--ink, #1d2540)">会社の</text>
    <text x="364" y="142" font-size="18" fill="var(--ink, #1d2540)">取扱説明書</text>
    <text x="364" y="192" font-size="26">📘</text>
    <text x="364" y="226" font-size="13" fill="#1d2540">全員が読む1冊</text>
  </g>
  <!-- レシピのボード -->
  <g stroke="var(--ink, #1d2540)" stroke-width="3" stroke-linecap="round">
    <line x1="510" y1="236" x2="504" y2="260"/><line x1="740" y1="236" x2="746" y2="260"/>
  </g>
  <rect x="482" y="44" width="286" height="194" rx="14" fill="var(--leaf-soft, #dcf1e8)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="555" y="54" width="140" height="30" rx="15" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="625" y="75" font-size="15" fill="var(--ink, #1d2540)">🍳 仕事のレシピ</text>
  </g>
  <!-- カード3枚 -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round" fill="var(--surface, #fff)">
    <rect x="496" y="98" width="80" height="124" rx="8" transform="rotate(-3 536 160)"/>
    <rect x="585" y="98" width="80" height="124" rx="8"/>
    <rect x="674" y="98" width="80" height="124" rx="8" transform="rotate(3 714 160)"/>
  </g>
  <g fill="var(--warm, #c0583a)" stroke="var(--ink, #1d2540)" stroke-width="1.5">
    <circle cx="536" cy="100" r="5"/><circle cx="625" cy="100" r="5"/><circle cx="714" cy="100" r="5"/>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <g transform="rotate(-3 536 160)">
      <text x="536" y="124" font-size="11" fill="var(--ink-soft, #545c78)">事務・請求</text>
      <text x="536" y="148" font-size="13" fill="var(--ink, #1d2540)">毎月の</text>
      <text x="536" y="166" font-size="13" fill="var(--ink, #1d2540)">請求</text>
    </g>
    <text x="625" y="124" font-size="11" fill="var(--ink-soft, #545c78)">拠点長</text>
    <text x="625" y="148" font-size="13" fill="var(--ink, #1d2540)">送迎</text>
    <text x="625" y="166" font-size="13" fill="var(--ink, #1d2540)">ルート</text>
    <g transform="rotate(3 714 160)">
      <text x="714" y="124" font-size="11" fill="var(--ink-soft, #545c78)">生活相談員</text>
      <text x="714" y="148" font-size="13" fill="var(--ink, #1d2540)">はじめて</text>
      <text x="714" y="166" font-size="13" fill="var(--ink, #1d2540)">の日</text>
    </g>
  </g>
  <!-- カードの手順の線 -->
  <g fill="none" stroke="var(--leaf, #2f8f6b)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-3 536 160)"><path d="M510 186 l4 4 l7 -8"/><line x1="528" y1="186" x2="562" y2="186"/><path d="M510 204 l4 4 l7 -8"/><line x1="528" y1="204" x2="556" y2="204"/></g>
    <path d="M599 186 l4 4 l7 -8"/><line x1="617" y1="186" x2="651" y2="186"/><path d="M599 204 l4 4 l7 -8"/><line x1="617" y1="204" x2="645" y2="204"/>
    <g transform="rotate(3 714 160)"><path d="M688 186 l4 4 l7 -8"/><line x1="706" y1="186" x2="740" y2="186"/><path d="M688 204 l4 4 l7 -8"/><line x1="706" y1="204" x2="734" y2="204"/></g>
  </g>
  <!-- くるりん -->
  <g transform="translate(60 180) scale(.9)">
    <g transform="translate(60 62)">
      <g fill="var(--sun, #f2b01e)">
        <rect x="-9" y="-54" width="18" height="22" rx="6"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(45)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(90)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(135)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(180)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(225)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(270)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(315)"/>
      </g>
      <circle r="40" fill="var(--sun, #f2b01e)"/><circle r="31" fill="#ffd866"/>
      <circle cx="-12" cy="-4" r="5" fill="#1d2540"/><circle cx="12" cy="-4" r="5" fill="#1d2540"/>
      <circle cx="-10.5" cy="-6" r="1.8" fill="#fff"/><circle cx="13.5" cy="-6" r="1.8" fill="#fff"/>
      <ellipse cx="-21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/><ellipse cx="21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/>
      <path d="M-9 9 Q0 19 9 9" fill="none" stroke="#1d2540" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <path d="M40 104 h196 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-138 l-14 14 l-2 -14 h-42 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="138" y="138" font-size="15" text-anchor="middle" fill="var(--ink, #1d2540)">読めばわかる会社にしよう！</text>
  </g>
</svg>
