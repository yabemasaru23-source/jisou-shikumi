<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="くるりんが押し入れから仕事を全部取り出して床にならべ、その先で光る宝箱を見つけている。吹き出しは「まずは全部、ならべてみよう！」">
  <rect width="800" height="320" rx="24" fill="var(--sky, #dbe7fb)"/>
  <!-- 床 -->
  <path d="M0 250 H800 V296 a24 24 0 0 1 -24 24 H24 a24 24 0 0 1 -24 -24 Z" fill="var(--leaf-soft, #dcf1e8)"/>
  <line x1="0" y1="250" x2="800" y2="250" stroke="var(--leaf, #2f8f6b)" stroke-width="2.5"/>
  <!-- 押し入れ -->
  <rect x="40" y="50" width="200" height="200" rx="6" fill="var(--sky-ink, #6f86b8)" opacity=".35"/>
  <rect x="40" y="50" width="200" height="200" rx="6" fill="none" stroke="var(--ink, #1d2540)" stroke-width="3"/>
  <line x1="40" y1="150" x2="240" y2="150" stroke="var(--ink, #1d2540)" stroke-width="3"/>
  <g stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round">
    <rect x="130" y="110" width="44" height="40" rx="4" fill="var(--sun-soft, #fdf0cc)"/>
    <rect x="180" y="122" width="40" height="28" rx="4" fill="var(--surface, #fff)"/>
    <rect x="150" y="214" width="56" height="36" rx="4" fill="var(--sun-soft, #fdf0cc)"/>
  </g>
  <!-- ひらいたふすま -->
  <rect x="40" y="50" width="76" height="200" rx="4" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="3"/>
  <circle cx="104" cy="150" r="5" fill="none" stroke="var(--ink, #1d2540)" stroke-width="2"/>
  <!-- 取り出した流れ -->
  <path d="M232 124 C 300 112, 390 140, 414 236" fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="2.5" stroke-dasharray="2 10" stroke-linecap="round"/>
  <!-- ならべた仕事 -->
  <g font-family="Zen Maru Gothic, sans-serif" font-size="12" font-weight="700" text-anchor="middle" stroke-linejoin="round">
    <rect x="404" y="258" width="44" height="32" rx="6" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/><text x="426" y="279" fill="var(--ink, #1d2540)">電話</text>
    <rect x="456" y="258" width="44" height="32" rx="6" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/><text x="478" y="279" fill="var(--ink, #1d2540)">見積</text>
    <rect x="508" y="258" width="44" height="32" rx="6" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/><text x="530" y="279" fill="var(--ink, #1d2540)">発注</text>
    <rect x="560" y="258" width="44" height="32" rx="6" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/><text x="582" y="279" fill="var(--ink, #1d2540)">請求</text>
    <rect x="612" y="258" width="44" height="32" rx="6" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/><text x="634" y="279" fill="var(--ink, #1d2540)">会議</text>
  </g>
  <!-- 宝箱 -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M748 186 L770 168 M712 176 L712 150 M676 186 L654 168" fill="none" stroke="var(--sun, #f2b01e)" stroke-width="4"/>
    <path d="M668 222 V206 a14 14 0 0 1 14 -14 h60 a14 14 0 0 1 14 14 V222 Z" fill="var(--warm, #c0583a)"/>
    <rect x="668" y="222" width="88" height="44" rx="4" fill="var(--warm, #c0583a)"/>
    <rect x="702" y="214" width="20" height="20" rx="4" fill="var(--sun, #f2b01e)"/>
    <line x1="668" y1="244" x2="756" y2="244" stroke="var(--sun, #f2b01e)" stroke-width="3"/>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="652" y="98" width="120" height="34" rx="17" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="712" y="121" font-size="15" fill="#1d2540">💎 宝もの！</text>
  </g>
  <!-- くるりん -->
  <g transform="translate(320 204) scale(.8)">
    <g fill="var(--sun, #f2b01e)">
      <rect x="-9" y="-54" width="18" height="22" rx="6"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(45)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(90)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(135)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(180)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(225)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(270)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(315)"/>
    </g>
    <circle r="40" fill="var(--sun, #f2b01e)"/><circle r="31" fill="#ffd866"/>
    <circle cx="-12" cy="-4" r="5" fill="#1d2540"/><circle cx="12" cy="-4" r="5" fill="#1d2540"/>
    <circle cx="-10.5" cy="-6" r="1.8" fill="#fff"/><circle cx="13.5" cy="-6" r="1.8" fill="#fff"/>
    <ellipse cx="-21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/><ellipse cx="21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/>
    <path d="M-10 8 Q0 22 10 8 Z" fill="#1d2540" stroke="#1d2540" stroke-width="2" stroke-linejoin="round"/>
    <!-- 手に持った仕事カード -->
    <g transform="translate(38 10) rotate(12)">
      <rect x="0" y="0" width="34" height="26" rx="4" fill="var(--surface, #fff)" stroke="#1d2540" stroke-width="2.5"/>
      <path d="M7 9 H27 M7 17 H21" stroke="var(--ink-soft, #545c78)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
  <!-- 吹き出し -->
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <path d="M300 26 h240 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-178 l-30 26 l4 -26 h-36 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="420" y="60" font-size="16" text-anchor="middle" fill="var(--ink, #1d2540)">まずは全部、ならべてみよう！</text>
  </g>
</svg>
