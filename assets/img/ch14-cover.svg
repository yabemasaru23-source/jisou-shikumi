<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="会社の玄関に「ようこそ」の旗がかかり、先輩たちが手をふって新しい仲間をむかえている。くるりんが「来てくれて、ありがとう！」と言っている">
  <rect width="800" height="320" rx="24" fill="var(--sky, #dbe7fb)"/>
  <!-- くも -->
  <g fill="var(--surface, #fff)" opacity=".85">
    <ellipse cx="330" cy="56" rx="42" ry="14"/><ellipse cx="360" cy="47" rx="26" ry="14"/>
    <ellipse cx="730" cy="60" rx="36" ry="12"/><ellipse cx="755" cy="52" rx="22" ry="12"/>
  </g>
  <!-- 丘 -->
  <ellipse cx="560" cy="340" rx="330" ry="70" fill="var(--leaf, #2f8f6b)" opacity=".8"/>
  <ellipse cx="120" cy="345" rx="240" ry="60" fill="var(--leaf, #2f8f6b)" opacity=".6"/>
  <!-- 会社の建物 -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linejoin="round">
    <path d="M450 130 L580 70 L710 130 Z" fill="var(--warm, #c0583a)"/>
    <rect x="465" y="130" width="230" height="160" fill="var(--surface, #fff)"/>
    <rect x="485" y="150" width="34" height="30" rx="4" fill="var(--sky, #dbe7fb)"/>
    <rect x="641" y="150" width="34" height="30" rx="4" fill="var(--sky, #dbe7fb)"/>
    <rect x="550" y="214" width="60" height="76" rx="6" fill="var(--sun-soft, #fdf0cc)"/>
  </g>
  <circle cx="598" cy="254" r="3.5" fill="var(--ink, #1d2540)"/>
  <!-- ようこその旗 -->
  <path d="M470 136 Q580 176 690 136" fill="none" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linecap="round"/>
  <g stroke="var(--ink, #1d2540)" stroke-width="1.5" stroke-linejoin="round">
    <path d="M492 144 l14 4 l-9 14 z" fill="var(--sun, #f2b01e)"/>
    <path d="M520 152 l14 3 l-8 14 z" fill="var(--leaf, #2f8f6b)"/>
    <path d="M626 155 l14 -3 l-5 15 z" fill="var(--leaf, #2f8f6b)"/>
    <path d="M654 148 l14 -4 l-4 15 z" fill="var(--sun, #f2b01e)"/>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <rect x="534" y="168" width="92" height="34" rx="10" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="580" y="191" font-size="17" text-anchor="middle" fill="#1d2540">ようこそ！</text>
  </g>
  <!-- 人の形 -->
  <defs>
    <g id="c14-man">
      <rect x="-14" y="-6" width="28" height="38" rx="12"/>
      <circle cy="-20" r="12" fill="var(--surface, #fff)"/>
    </g>
  </defs>
  <!-- 先輩たち（手をふる） -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(520 258)" fill="var(--leaf, #2f8f6b)">
      <use href="#c14-man"/><path d="M-12 2 L-26 -22" fill="none"/>
    </g>
    <g transform="translate(650 258)" fill="var(--sky-ink, #6f86b8)">
      <use href="#c14-man"/><path d="M12 2 L26 -22" fill="none"/>
    </g>
    <g transform="translate(700 262)" fill="var(--warm, #c0583a)">
      <use href="#c14-man"/><path d="M12 2 L24 -20" fill="none"/>
    </g>
    <!-- 新しい仲間 -->
    <g transform="translate(420 262)" fill="var(--sun, #f2b01e)">
      <use href="#c14-man"/>
      <rect x="10" y="10" width="18" height="16" rx="3" fill="var(--surface, #fff)"/>
    </g>
  </g>
  <!-- 顔（にっこり） -->
  <g fill="none" stroke="#1d2540" stroke-width="2" stroke-linecap="round">
    <path d="M515 239 q5 4 10 0"/><path d="M645 239 q5 4 10 0"/><path d="M695 243 q5 4 10 0"/><path d="M415 243 q5 4 10 0"/>
  </g>
  <!-- きらきら -->
  <g fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="1.5" stroke-linejoin="round">
    <path d="M470 206 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"/>
    <path d="M745 214 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"/>
  </g>
  <!-- くるりん -->
  <g transform="translate(130 222)">
    <g fill="var(--sun, #f2b01e)">
      <rect x="-9" y="-54" width="18" height="22" rx="6"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(45)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(90)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(135)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(180)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(225)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(270)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(315)"/>
    </g>
    <circle r="40" fill="var(--sun, #f2b01e)"/><circle r="31" fill="#ffd866"/>
    <circle cx="-12" cy="-4" r="5" fill="#1d2540"/><circle cx="12" cy="-4" r="5" fill="#1d2540"/>
    <circle cx="-10.5" cy="-6" r="1.8" fill="#fff"/><circle cx="13.5" cy="-6" r="1.8" fill="#fff"/>
    <ellipse cx="-21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/><ellipse cx="21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/>
    <path d="M-9 9 Q0 19 9 9" fill="none" stroke="#1d2540" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <path d="M30 96 h210 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-96 l-14 14 l-2 -14 h-98 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="135" y="130" font-size="15" text-anchor="middle" fill="var(--ink, #1d2540)">来てくれて、ありがとう！</text>
  </g>
</svg>
