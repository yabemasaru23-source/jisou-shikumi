<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="山の中腹の山小屋でひと休み。たき火のそばに地図が広げてあり、「いまここ」の印と次の山小屋の旗がある。道しるべには「次の山小屋まで 90日」。くるりんが「ここまで、よく来たね！」と言っている">
  <rect width="800" height="320" rx="24" fill="var(--sky, #dbe7fb)"/>
  <!-- くも -->
  <g fill="var(--surface, #fff)" opacity=".85">
    <ellipse cx="140" cy="46" rx="44" ry="15"/><ellipse cx="172" cy="37" rx="28" ry="15"/>
    <ellipse cx="690" cy="60" rx="40" ry="13"/><ellipse cx="718" cy="52" rx="24" ry="13"/>
  </g>
  <!-- 山 -->
  <path d="M330 262 L560 56 L790 262 Z" fill="var(--sky-ink, #6f86b8)" opacity=".75"/>
  <path d="M560 56 L522 90 L540 84 L554 96 L568 84 L584 94 L597 89 Z" fill="var(--surface, #fff)"/>
  <g transform="translate(560 40)">
    <path d="M0 -14 L4 -5 L14 -4 L6 2 L9 12 L0 7 L-9 12 L-6 2 L-14 -4 L-4 -5 Z" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <!-- 登ってきた道 -->
  <path d="M300 236 C360 230, 400 200, 440 180 S520 120, 552 70" fill="none" stroke="var(--surface, #fff)" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round"/>
  <!-- 地面 -->
  <ellipse cx="400" cy="340" rx="470" ry="90" fill="var(--leaf, #2f8f6b)" opacity=".8"/>
  <!-- 山小屋 -->
  <g transform="translate(250 200)" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round">
    <rect x="22" y="-34" width="12" height="24" fill="var(--ink-soft, #545c78)"/>
    <path d="M-54 2 L0 -40 L54 2 Z" fill="var(--warm, #c0583a)"/>
    <rect x="-42" y="2" width="84" height="52" fill="var(--surface, #fff)"/>
    <rect x="-28" y="20" width="18" height="34" fill="var(--ink, #1d2540)"/>
    <rect x="6" y="14" width="24" height="18" rx="3" fill="var(--sun, #f2b01e)"/>
  </g>
  <!-- たき火 -->
  <g stroke="var(--ink-soft, #545c78)" stroke-width="7" stroke-linecap="round">
    <line x1="354" y1="284" x2="406" y2="270"/><line x1="354" y1="270" x2="406" y2="284"/>
  </g>
  <path d="M380 226 C396 244 402 256 392 272 H368 C358 256 364 244 380 226 Z" fill="var(--warm, #c0583a)" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M380 246 C388 255 390 263 385 272 H375 C370 263 372 255 380 246 Z" fill="var(--sun, #f2b01e)"/>
  <g fill="var(--sun, #f2b01e)"><circle cx="400" cy="222" r="3"/><circle cx="362" cy="214" r="2.5"/><circle cx="392" cy="206" r="2"/></g>
  <!-- 広げた地図 -->
  <rect x="452" y="256" width="168" height="52" rx="6" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
  <path d="M470 296 L522 288 L566 298 L604 276" fill="none" stroke="var(--warm, #c0583a)" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="470" cy="296" r="4" fill="var(--leaf, #2f8f6b)"/>
  <circle cx="522" cy="288" r="6" fill="var(--warm, #c0583a)" stroke="var(--ink, #1d2540)" stroke-width="1.5"/>
  <line x1="604" y1="278" x2="604" y2="250" stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M604 250 L620 256 L604 262 Z" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- 道しるべ -->
  <line x1="716" y1="208" x2="716" y2="284" stroke="var(--ink, #1d2540)" stroke-width="4" stroke-linecap="round"/>
  <path d="M640 176 H772 L788 193 L772 210 H640 Z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round"/>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <text x="522" y="276" font-size="12" fill="var(--ink, #1d2540)">いまここ</text>
    <text x="706" y="198" font-size="13" fill="var(--ink, #1d2540)">次の山小屋まで 90日</text>
  </g>
  <!-- くるりん -->
  <g transform="translate(40 160)">
    <g transform="translate(60 62)">
      <g fill="var(--sun, #f2b01e)">
        <rect x="-9" y="-54" width="18" height="22" rx="6"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(45)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(90)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(135)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(180)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(225)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(270)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(315)"/>
      </g>
      <circle r="40" fill="var(--sun, #f2b01e)"/><circle r="31" fill="#ffd866"/>
      <circle cx="-12" cy="-4" r="5" fill="#1d2540"/><circle cx="12" cy="-4" r="5" fill="#1d2540"/>
      <circle cx="-10.5" cy="-6" r="1.8" fill="#fff"/><circle cx="13.5" cy="-6" r="1.8" fill="#fff"/>
      <ellipse cx="-21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/><ellipse cx="21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/>
      <path d="M-9 9 Q0 19 9 9" fill="none" stroke="#1d2540" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <path d="M40 90 h168 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-110 l-14 14 l-2 -14 h-42 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="124" y="124" font-size="15" text-anchor="middle" fill="var(--ink, #1d2540)">ここまで、よく来たね！</text>
  </g>
</svg>
