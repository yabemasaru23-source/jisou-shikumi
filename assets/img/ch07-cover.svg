<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="劇の舞台に「3年後の配役表」がかかり、部長・拠点長・地域連携・事務担当の名札が並んでいる。地域連携の役だけはまだ空いていて、スポットライトが当たっている。くるりんが「役割に、人をつけよう！」と言っている">
  <rect width="800" height="320" rx="24" fill="var(--sky, #dbe7fb)"/>
  <!-- 空いている役へのスポットライト -->
  <path d="M490 42 L530 42 L584 252 L436 252 Z" fill="var(--sun, #f2b01e)" opacity=".25"/>
  <!-- 舞台の床 -->
  <rect x="24" y="252" width="752" height="54" rx="10" fill="var(--sun-soft, #fdf0cc)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
  <line x1="36" y1="266" x2="764" y2="266" stroke="var(--sun, #f2b01e)" stroke-width="2" stroke-linecap="round"/>
  <!-- カーテン -->
  <path d="M24 34 H104 Q84 140 110 252 H24 Z" fill="var(--warm, #c0583a)"/>
  <path d="M776 34 H696 Q716 140 690 252 H776 Z" fill="var(--warm, #c0583a)"/>
  <g fill="none" stroke="var(--surface, #fff)" stroke-width="2" stroke-linecap="round" opacity=".35">
    <path d="M52 44 Q44 140 56 244"/><path d="M78 44 Q70 140 82 244"/>
    <path d="M748 44 Q756 140 744 244"/><path d="M722 44 Q730 140 718 244"/>
  </g>
  <rect x="24" y="16" width="752" height="26" rx="10" fill="var(--warm, #c0583a)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
  <!-- 配役表の看板 -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linecap="round">
    <line x1="330" y1="42" x2="330" y2="56"/><line x1="470" y1="42" x2="470" y2="56"/>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="300" y="56" width="200" height="36" rx="18" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="400" y="80" font-size="16" fill="var(--ink, #1d2540)">🎭 3年後の配役表</text>
  </g>
  <!-- 役者と名札 -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round">
    <path d="M244 214 V192 Q244 170 270 170 Q296 170 296 192 V214 Z" fill="var(--leaf, #2f8f6b)"/>
    <circle cx="270" cy="148" r="17" fill="var(--surface, #fff)"/>
    <path d="M364 214 V192 Q364 170 390 170 Q416 170 416 192 V214 Z" fill="var(--sky-ink, #6f86b8)"/>
    <circle cx="390" cy="148" r="17" fill="var(--surface, #fff)"/>
    <path d="M604 214 V192 Q604 170 630 170 Q656 170 656 192 V214 Z" fill="var(--sun, #f2b01e)"/>
    <circle cx="630" cy="148" r="17" fill="var(--surface, #fff)"/>
  </g>
  <g fill="var(--ink, #1d2540)">
    <circle cx="264" cy="146" r="2"/><circle cx="276" cy="146" r="2"/>
    <circle cx="384" cy="146" r="2"/><circle cx="396" cy="146" r="2"/>
    <circle cx="624" cy="146" r="2"/><circle cx="636" cy="146" r="2"/>
  </g>
  <g fill="none" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linecap="round">
    <path d="M265 153 Q270 158 275 153"/><path d="M385 153 Q390 158 395 153"/><path d="M625 153 Q630 158 635 153"/>
  </g>
  <!-- 空いている役 -->
  <g fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="2" stroke-dasharray="6 6" stroke-linecap="round">
    <path d="M484 214 V192 Q484 170 510 170 Q536 170 536 192 V214"/>
    <circle cx="510" cy="148" r="17"/>
  </g>
  <!-- 名札の脚 -->
  <g stroke="var(--ink, #1d2540)" stroke-width="3" stroke-linecap="round">
    <line x1="240" y1="246" x2="240" y2="254"/><line x1="300" y1="246" x2="300" y2="254"/>
    <line x1="360" y1="246" x2="360" y2="254"/><line x1="420" y1="246" x2="420" y2="254"/>
    <line x1="480" y1="246" x2="480" y2="254"/><line x1="540" y1="246" x2="540" y2="254"/>
    <line x1="600" y1="246" x2="600" y2="254"/><line x1="660" y1="246" x2="660" y2="254"/>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <text x="510" y="154" font-size="18" fill="var(--ink-soft, #545c78)">？</text>
    <rect x="220" y="210" width="100" height="36" rx="8" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <text x="270" y="234" font-size="15" fill="var(--ink, #1d2540)">部長</text>
    <rect x="340" y="210" width="100" height="36" rx="8" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <text x="390" y="234" font-size="15" fill="var(--ink, #1d2540)">拠点長</text>
    <rect x="460" y="210" width="100" height="36" rx="8" fill="var(--surface, #fff)" stroke="var(--warm, #c0583a)" stroke-width="2.5" stroke-dasharray="7 5"/>
    <text x="510" y="234" font-size="15" fill="var(--ink, #1d2540)">地域連携</text>
    <rect x="580" y="210" width="100" height="36" rx="8" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <text x="630" y="234" font-size="15" fill="var(--ink, #1d2540)">事務担当</text>
    <text x="510" y="290" font-size="13" fill="var(--warm, #c0583a)">空いている役</text>
  </g>
  <!-- くるりん -->
  <g transform="translate(40 180) scale(.9)">
    <g transform="translate(60 62)">
      <g fill="var(--sun, #f2b01e)">
        <rect x="-9" y="-54" width="18" height="22" rx="6"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(45)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(90)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(135)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(180)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(225)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(270)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(315)"/>
      </g>
      <circle r="40" fill="var(--sun, #f2b01e)"/><circle r="31" fill="#ffd866"/>
      <circle cx="-12" cy="-4" r="5" fill="#1d2540"/><circle cx="12" cy="-4" r="5" fill="#1d2540"/>
      <circle cx="-10.5" cy="-6" r="1.8" fill="#fff"/><circle cx="13.5" cy="-6" r="1.8" fill="#fff"/>
      <ellipse cx="-21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/><ellipse cx="21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/>
      <path d="M-9 9 Q0 19 9 9" fill="none" stroke="#1d2540" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <path d="M40 104 h168 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-110 l-14 14 l-2 -14 h-42 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="124" y="138" font-size="15" text-anchor="middle" fill="var(--ink, #1d2540)">役割に、人をつけよう！</text>
  </g>
</svg>
