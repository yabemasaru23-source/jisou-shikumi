<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="テーブルの上でジグソーパズルを組んでいる。奥には箱の絵（会社の夢の完成図）が立ててあり、くるりんがピースを持って「箱の絵を見て、ピースをはめよう！」と話している">
  <defs>
    <path id="c05-piece" d="M0 0 H14 A6 6 0 1 1 26 0 H40 V14 A6 6 0 1 1 40 26 V40 H0 Z"/>
  </defs>
  <rect width="800" height="320" rx="24" fill="var(--sky, #dbe7fb)"/>
  <!-- くも -->
  <g fill="var(--surface, #fff)" opacity=".85">
    <ellipse cx="380" cy="52" rx="40" ry="13"/><ellipse cx="408" cy="44" rx="24" ry="13"/>
    <ellipse cx="770" cy="30" rx="30" ry="10"/>
  </g>
  <!-- テーブル -->
  <path d="M0 236 H800 V296 a24 24 0 0 1 -24 24 H24 a24 24 0 0 1 -24 -24 Z" fill="var(--sun-soft, #fdf0cc)"/>
  <line x1="0" y1="236" x2="800" y2="236" stroke="var(--ink-soft, #545c78)" stroke-width="2.5"/>
  <!-- パズルの箱（箱の絵） -->
  <rect x="470" y="48" width="270" height="182" rx="10" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="3"/>
  <rect x="486" y="62" width="238" height="128" fill="var(--sky, #dbe7fb)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
  <circle cx="696" cy="88" r="13" fill="var(--sun, #f2b01e)"/>
  <path d="M487 189 Q560 128 636 158 Q684 140 723 150 V189 Z" fill="var(--leaf, #2f8f6b)" opacity=".85"/>
  <g stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round">
    <path d="M556 152 L580 130 L604 152 Z" fill="var(--warm, #c0583a)"/>
    <rect x="561" y="152" width="38" height="26" fill="var(--surface, #fff)"/>
    <rect x="575" y="162" width="10" height="16" fill="var(--ink, #1d2540)"/>
    <line x1="520" y1="176" x2="520" y2="164" stroke-linecap="round"/>
  </g>
  <circle cx="520" cy="156" r="11" fill="var(--leaf, #2f8f6b)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
  <g stroke="var(--surface, #fff)" stroke-width="1.5" opacity=".6" fill="none">
    <path d="M565 63 V189 M645 63 V189 M487 126 H723"/>
  </g>
  <text x="605" y="216" font-family="Zen Maru Gothic, sans-serif" font-weight="700" font-size="15" text-anchor="middle" fill="var(--ink, #1d2540)">🏝 会社の夢の完成図</text>
  <!-- 見比べる -->
  <path d="M168 150 Q320 112 458 134" fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="2.5" stroke-dasharray="3 8" stroke-linecap="round"/>
  <path d="M448 126 L459 134 L447 141" fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="318" y="112" font-family="Zen Maru Gothic, sans-serif" font-weight="700" font-size="13" text-anchor="middle" fill="var(--ink-soft, #545c78)">箱の絵と見比べる</text>
  <!-- 組みかけのパズル -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linejoin="round">
    <use href="#c05-piece" transform="translate(250 252) scale(.8)" fill="var(--sky, #dbe7fb)"/>
    <use href="#c05-piece" transform="translate(282 252) scale(.8)" fill="var(--leaf-soft, #dcf1e8)"/>
    <use href="#c05-piece" transform="translate(314 252) scale(.8)" fill="var(--sky, #dbe7fb)"/>
    <use href="#c05-piece" transform="translate(250 284) scale(.8)" fill="var(--leaf-soft, #dcf1e8)"/>
    <use href="#c05-piece" transform="translate(282 284) scale(.8)" fill="var(--sun-soft, #fdf0cc)"/>
    <use href="#c05-piece" transform="translate(314 284) scale(.8)" fill="var(--leaf-soft, #dcf1e8)"/>
    <use href="#c05-piece" transform="translate(346 284) scale(.8)" fill="var(--surface, #fff)"/>
    <use href="#c05-piece" transform="translate(378 284) scale(.8)" fill="var(--leaf-soft, #dcf1e8)"/>
    <!-- ばらばらのピース -->
    <use href="#c05-piece" transform="translate(430 256) rotate(20) scale(.8)" fill="var(--sky, #dbe7fb)"/>
    <use href="#c05-piece" transform="translate(468 292) rotate(-30) scale(.8)" fill="var(--warm, #c0583a)"/>
    <use href="#c05-piece" transform="translate(196 270) rotate(-15) scale(.8)" fill="var(--sun-soft, #fdf0cc)"/>
    <use href="#c05-piece" transform="translate(620 262) rotate(10) scale(.8)" fill="var(--leaf-soft, #dcf1e8)"/>
  </g>
  <!-- くるりん -->
  <g transform="translate(40 118) scale(.95)">
    <g transform="translate(60 62)">
      <g fill="var(--sun, #f2b01e)">
        <rect x="-9" y="-54" width="18" height="22" rx="6"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(45)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(90)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(135)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(180)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(225)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(270)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(315)"/>
      </g>
      <circle r="40" fill="var(--sun, #f2b01e)"/><circle r="31" fill="#ffd866"/>
      <circle cx="-12" cy="-4" r="5" fill="#1d2540"/><circle cx="12" cy="-4" r="5" fill="#1d2540"/>
      <circle cx="-10.5" cy="-6" r="1.8" fill="#fff"/><circle cx="13.5" cy="-6" r="1.8" fill="#fff"/>
      <ellipse cx="-21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/><ellipse cx="21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/>
      <path d="M-9 9 Q0 19 9 9" fill="none" stroke="#1d2540" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 持っているピース -->
      <use href="#c05-piece" transform="translate(30 14) rotate(-15) scale(.75)" fill="var(--sky, #dbe7fb)" stroke="#1d2540" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <path d="M40 30 h236 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-150 l-14 14 l-2 -14 h-70 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round"/>
    <text x="158" y="64" font-size="15" text-anchor="middle" fill="var(--ink, #1d2540)">箱の絵を見て、ピースをはめよう！</text>
  </g>
</svg>
