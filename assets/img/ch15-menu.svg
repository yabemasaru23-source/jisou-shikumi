<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" role="img" aria-label="育成メニューは3段のお弁当箱。いちばん下のごはんの段が全員共通、まん中のおかずの段が役割別、いちばん上のデザートの段がリーダー。どの段も、学び方と教材で教え、育ったかどうかをはかる">
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <!-- ふたと結び目 -->
    <rect x="60" y="26" width="400" height="24" rx="10" fill="var(--warm, #c0583a)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <g fill="var(--warm, #c0583a)" stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linejoin="round">
      <path d="M260 26 Q236 6 226 22 Q238 32 260 26 Z"/>
      <path d="M260 26 Q284 6 294 22 Q282 32 260 26 Z"/>
    </g>
    <!-- 上の段：リーダー -->
    <rect x="60" y="56" width="400" height="90" rx="14" fill="var(--sun-soft, #fdf0cc)" stroke="var(--sun, #f2b01e)" stroke-width="2.5"/>
    <text x="260" y="86" font-size="18" fill="var(--ink, #1d2540)">🍓 リーダー（デザート）</text>
    <text x="260" y="110" font-size="13" fill="var(--ink-soft, #545c78)">人をまとめる人・その候補</text>
    <text x="260" y="130" font-size="13" fill="var(--ink-soft, #545c78)">行き先を示し、人を育て、仕組みで回す力</text>
    <!-- まん中の段：役割別 -->
    <rect x="60" y="152" width="400" height="90" rx="14" fill="var(--leaf-soft, #dcf1e8)" stroke="var(--leaf, #2f8f6b)" stroke-width="2.5"/>
    <text x="260" y="182" font-size="18" fill="var(--ink, #1d2540)">🍳 役割別（おかず）</text>
    <text x="260" y="206" font-size="13" fill="var(--ink-soft, #545c78)">その役割の人</text>
    <text x="260" y="226" font-size="13" fill="var(--ink-soft, #545c78)">役割の約束書を果たすための力と知識</text>
    <!-- 下の段：全員共通 -->
    <rect x="60" y="248" width="400" height="90" rx="14" fill="var(--sky, #dbe7fb)" stroke="var(--sky-ink, #6f86b8)" stroke-width="2.5"/>
    <text x="260" y="278" font-size="18" fill="var(--ink, #1d2540)">🍚 全員共通（ごはん）</text>
    <text x="260" y="302" font-size="13" fill="var(--ink-soft, #545c78)">入社したすべての人</text>
    <text x="260" y="322" font-size="13" fill="var(--ink-soft, #545c78)">会社のこと・合言葉・基本ルール</text>
    <text x="260" y="370" font-size="13" fill="var(--ink-soft, #545c78)">下の段から、順に積み上げていく</text>
    <!-- かっこ -->
    <path d="M476 58 Q494 58 494 76 V180 Q494 197 510 197 Q494 197 494 214 V318 Q494 336 476 336" fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- どの段も -->
    <text x="645" y="70" font-size="15" fill="var(--ink-soft, #545c78)">どの段も</text>
    <rect x="520" y="86" width="250" height="100" rx="14" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <text x="645" y="118" font-size="16" fill="var(--ink, #1d2540)">👂 学び方と教材で教える</text>
    <text x="645" y="146" font-size="12" fill="var(--ink-soft, #545c78)">聞く・見る・やってみる・教える</text>
    <text x="645" y="168" font-size="12" fill="var(--ink-soft, #545c78)">教材は「仕事のレシピ」</text>
    <rect x="520" y="208" width="250" height="100" rx="14" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <text x="645" y="240" font-size="16" fill="var(--ink, #1d2540)">📏 育ったかをはかる</text>
    <text x="645" y="268" font-size="12" fill="var(--ink-soft, #545c78)">受けた・わかった・できた・成果</text>
    <text x="645" y="290" font-size="12" fill="var(--ink-soft, #545c78)">「受けた」で終わらせない</text>
  </g>
</svg>
