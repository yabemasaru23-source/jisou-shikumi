<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="黒板のような「会社の時間割」に、毎週の作戦会議、毎月の拠点長会議と1対1の応援面談、年2回の全員集合ミーティングが書かれ、それぞれの回数が点のリズムで並んでいる。下では心臓がトクン、トクンと脈を打っている。くるりんが「決まった日に、集まろう！」と言っている">
  <rect width="800" height="320" rx="24" fill="var(--sky, #dbe7fb)"/>
  <!-- くも -->
  <g fill="var(--surface, #fff)" opacity=".85">
    <ellipse cx="110" cy="44" rx="42" ry="14"/><ellipse cx="142" cy="36" rx="26" ry="14"/>  </g>
  <!-- 会社の時間割 -->
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <rect x="300" y="20" width="460" height="196" rx="16" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <text x="530" y="50" font-size="17" text-anchor="middle" fill="var(--ink, #1d2540)">📅 会社の時間割</text>
    <line x1="316" y1="64" x2="744" y2="64" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linecap="round"/>
    <g stroke="var(--ink-soft, #545c78)" stroke-width="1.5" stroke-dasharray="4 5" opacity=".5">
      <line x1="316" y1="104" x2="744" y2="104"/><line x1="316" y1="136" x2="744" y2="136"/><line x1="316" y1="168" x2="744" y2="168"/>
    </g>
    <!-- 回数のタグ -->
    <rect x="320" y="76" width="64" height="24" rx="12" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="1.5"/>
    <rect x="320" y="108" width="64" height="24" rx="12" fill="var(--leaf-soft, #dcf1e8)" stroke="var(--leaf, #2f8f6b)" stroke-width="2"/>
    <rect x="320" y="140" width="64" height="24" rx="12" fill="var(--leaf-soft, #dcf1e8)" stroke="var(--leaf, #2f8f6b)" stroke-width="2"/>
    <rect x="320" y="172" width="64" height="24" rx="12" fill="var(--sky, #dbe7fb)" stroke="var(--sky-ink, #6f86b8)" stroke-width="2"/>
    <g font-size="13" text-anchor="middle">
      <text x="352" y="93" fill="#1d2540">毎週</text>
      <text x="352" y="125" fill="var(--ink, #1d2540)">毎月</text>
      <text x="352" y="157" fill="var(--ink, #1d2540)">毎月</text>
      <text x="352" y="189" fill="var(--ink, #1d2540)">年2回</text>
    </g>
    <g font-size="16" fill="var(--ink, #1d2540)">
      <text x="400" y="94">作戦会議</text>
      <text x="400" y="126">拠点長会議</text>
      <text x="400" y="158">1対1の応援面談</text>
      <text x="400" y="190">全員集合ミーティング</text>
    </g>
  </g>
  <!-- リズムの点 -->
  <g fill="var(--warm, #c0583a)">
    <circle cx="584" cy="88" r="4"/><circle cx="596" cy="88" r="4"/><circle cx="608" cy="88" r="4"/><circle cx="620" cy="88" r="4"/><circle cx="632" cy="88" r="4"/><circle cx="644" cy="88" r="4"/><circle cx="656" cy="88" r="4"/><circle cx="668" cy="88" r="4"/><circle cx="680" cy="88" r="4"/><circle cx="692" cy="88" r="4"/><circle cx="704" cy="88" r="4"/><circle cx="716" cy="88" r="4"/><circle cx="728" cy="88" r="4"/><circle cx="740" cy="88" r="4"/>
    <circle cx="590" cy="120" r="5"/><circle cx="620" cy="120" r="5"/><circle cx="650" cy="120" r="5"/><circle cx="680" cy="120" r="5"/><circle cx="710" cy="120" r="5"/><circle cx="740" cy="120" r="5"/>
    <circle cx="590" cy="152" r="5"/><circle cx="620" cy="152" r="5"/><circle cx="650" cy="152" r="5"/><circle cx="680" cy="152" r="5"/><circle cx="710" cy="152" r="5"/><circle cx="740" cy="152" r="5"/>
    <circle cx="610" cy="184" r="6"/><circle cx="710" cy="184" r="6"/>
  </g>
  <!-- 心臓と脈 -->
  <path d="M206 292 C184 278 176 266 182 257 C188 248 200 250 206 259 C212 250 224 248 230 257 C236 266 228 278 206 292 Z" fill="var(--warm, #c0583a)" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M238 276 h30 l6 -8 l6 8 h8 l6 -36 l8 60 l6 -24 h30 h30 l6 -8 l6 8 h8 l6 -36 l8 60 l6 -24 h30 h30 l6 -8 l6 8 h8 l6 -36 l8 60 l6 -24 h30 h30 l6 -8 l6 8 h8 l6 -36 l8 60 l6 -24 h30 h30 l6 -8 l6 8 h8 l6 -36 l8 60 l6 -24 h30 H770" fill="none" stroke="var(--warm, #c0583a)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- くるりん -->
  <g transform="translate(40 150)">
    <g transform="translate(60 62)">
      <g fill="var(--sun, #f2b01e)">
        <rect x="-9" y="-54" width="18" height="22" rx="6"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(45)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(90)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(135)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(180)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(225)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(270)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(315)"/>
      </g>
      <circle r="40" fill="var(--sun, #f2b01e)"/><circle r="31" fill="#ffd866"/>
      <circle cx="-12" cy="-4" r="5" fill="#1d2540"/><circle cx="12" cy="-4" r="5" fill="#1d2540"/>
      <circle cx="-10.5" cy="-6" r="1.8" fill="#fff"/><circle cx="13.5" cy="-6" r="1.8" fill="#fff"/>
      <ellipse cx="-21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/><ellipse cx="21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/>
      <path d="M-9 9 Q0 19 9 9" fill="none" stroke="#1d2540" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <path d="M40 84 h168 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-110 l-14 14 l-2 -14 h-42 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="124" y="118" font-size="15" text-anchor="middle" fill="var(--ink, #1d2540)">決まった日に、集まろう！</text>
  </g>
</svg>
