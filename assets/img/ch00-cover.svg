<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="左は社長ひとりが屋根をささえている「あの人頼みの会社」、右は土台の上にしっかり建ち、窓からみんなが笑っている「仕組みで回る会社」。右はしで、くるりんが設計図を持って「いっしょに、会社の設計図をつくろう！」と話している">
  <rect width="800" height="320" rx="24" fill="var(--sky, #dbe7fb)"/>
  <!-- くも -->
  <g fill="var(--surface, #fff)" opacity=".85">
    <ellipse cx="310" cy="72" rx="40" ry="14"/><ellipse cx="336" cy="62" rx="24" ry="13"/>
    <ellipse cx="56" cy="92" rx="30" ry="11"/>
  </g>
  <!-- 丘 -->
  <ellipse cx="150" cy="330" rx="240" ry="60" fill="var(--leaf, #2f8f6b)" opacity=".7"/>
  <ellipse cx="560" cy="335" rx="300" ry="62" fill="var(--leaf, #2f8f6b)" opacity=".85"/>
  <!-- 見出し -->
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="60" y="20" width="180" height="36" rx="18" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="150" y="44" font-size="16" fill="var(--ink, #1d2540)">あの人頼みの会社</text>
    <rect x="390" y="20" width="170" height="36" rx="18" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="475" y="44" font-size="16" fill="#1d2540">仕組みで回る会社</text>
  </g>
  <!-- 左：ひとりで屋根をささえる社長 -->
  <path d="M58 152 L150 98 L244 142 Z" fill="var(--warm, #c0583a)" stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linejoin="round"/>
  <g stroke="var(--ink, #1d2540)" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M150 195 L128 149"/><path d="M150 195 L172 147"/>
    <path d="M150 191 V235"/><path d="M150 235 L136 266"/><path d="M150 235 L164 266"/>
  </g>
  <circle cx="150" cy="178" r="13" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
  <circle cx="145" cy="176" r="1.8" fill="var(--ink, #1d2540)"/><circle cx="155" cy="176" r="1.8" fill="var(--ink, #1d2540)"/>
  <path d="M145 185 Q150 181 155 185" fill="none" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linecap="round"/>
  <path d="M174 160 q5 7 0 10 q-5 -3 0 -10 z" fill="var(--sky-ink, #6f86b8)"/>
  <path d="M124 166 q4 6 0 9 q-4 -3 0 -9 z" fill="var(--sky-ink, #6f86b8)"/>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="65" y="280" width="170" height="28" rx="14" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="150" y="299" font-size="13" fill="var(--ink, #1d2540)">社長ひとりが、ささえる</text>
  </g>
  <!-- まんなかの矢印 -->
  <path d="M262 188 H318 V176 L348 200 L318 224 V212 H262 Z" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round"/>
  <!-- 右：仕組みで回る会社 -->
  <path d="M370 170 L475 104 L580 170 Z" fill="var(--warm, #c0583a)" stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="388" y="170" width="174" height="88" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
  <rect x="376" y="258" width="198" height="14" rx="4" fill="var(--leaf, #2f8f6b)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
  <!-- 窓の中の仲間 -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2">
    <rect x="402" y="186" width="40" height="34" rx="4" fill="var(--sky, #dbe7fb)"/>
    <rect x="508" y="186" width="40" height="34" rx="4" fill="var(--sky, #dbe7fb)"/>
    <circle cx="422" cy="205" r="9" fill="var(--surface, #fff)"/>
    <circle cx="528" cy="205" r="9" fill="var(--surface, #fff)"/>
  </g>
  <g fill="var(--ink, #1d2540)">
    <circle cx="419" cy="203" r="1.5"/><circle cx="425" cy="203" r="1.5"/>
    <circle cx="525" cy="203" r="1.5"/><circle cx="531" cy="203" r="1.5"/>
  </g>
  <g fill="none" stroke="var(--ink, #1d2540)" stroke-width="1.8" stroke-linecap="round">
    <path d="M418 208 Q422 212 426 208"/><path d="M524 208 Q528 212 532 208"/>
  </g>
  <rect x="459" y="214" width="32" height="44" rx="4" fill="var(--ink, #1d2540)"/>
  <!-- 回る歯車 -->
  <g transform="translate(475 192)">
    <circle r="11" fill="none" stroke="var(--sun, #f2b01e)" stroke-width="7" stroke-dasharray="4.6 4.04"/>
    <circle r="8" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <circle r="3" fill="var(--surface, #fff)"/>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="385" y="280" width="180" height="28" rx="14" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="475" y="299" font-size="13" fill="var(--ink, #1d2540)">仕組みで、みんなが動ける</text>
  </g>
  <!-- くるりん -->
  <g transform="translate(639 179.3) scale(.85)">
    <g transform="translate(60 62)">
      <g fill="var(--sun, #f2b01e)">
        <rect x="-9" y="-54" width="18" height="22" rx="6"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(45)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(90)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(135)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(180)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(225)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(270)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(315)"/>
      </g>
      <circle r="40" fill="var(--sun, #f2b01e)"/><circle r="31" fill="#ffd866"/>
      <circle cx="-12" cy="-4" r="5" fill="#1d2540"/><circle cx="12" cy="-4" r="5" fill="#1d2540"/>
      <circle cx="-10.5" cy="-6" r="1.8" fill="#fff"/><circle cx="13.5" cy="-6" r="1.8" fill="#fff"/>
      <ellipse cx="-21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/><ellipse cx="21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/>
      <path d="M-9 9 Q0 19 9 9" fill="none" stroke="#1d2540" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 設計図 -->
      <g transform="translate(30 16) rotate(-10)">
        <rect x="0" y="0" width="42" height="32" rx="3" fill="var(--sky, #dbe7fb)" stroke="#1d2540" stroke-width="2"/>
        <path d="M8 24 V12 L21 5 L34 12 V24 Z" fill="none" stroke="var(--sky-ink, #6f86b8)" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <path d="M594 62 h182 a14 14 0 0 1 14 14 v38 a14 14 0 0 1 -14 14 h-96 l-14 22 l-4 -22 h-68 a14 14 0 0 1 -14 -14 v-38 a14 14 0 0 1 14 -14 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="685" y="91" font-size="15" fill="var(--ink, #1d2540)">いっしょに、</text>
    <text x="685" y="115" font-size="15" fill="var(--ink, #1d2540)">会社の設計図をつくろう！</text>
  </g>
</svg>
