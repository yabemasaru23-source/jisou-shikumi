<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="丘をこえていく旅の道に、知る・問い合わせる・相談する・使い始める・使いつづける・お別れの6つの立ち寄り場所が並ぶ。空には「お客様との約束」の旗がかかっている。くるりんが旅のしおりを持って「お客様が通る道を、出会いからお別れまで歩いてみよう」と言っている">
  <rect width="800" height="320" rx="24" fill="var(--sky, #dbe7fb)"/>
  <!-- くも -->
  <g fill="var(--surface, #fff)" opacity=".85">
    <ellipse cx="400" cy="120" rx="40" ry="13"/><ellipse cx="428" cy="112" rx="26" ry="13"/>
    <ellipse cx="720" cy="100" rx="36" ry="12"/><ellipse cx="744" cy="93" rx="22" ry="12"/>
  </g>
  <!-- 遠くの山 -->
  <path d="M470 320 L600 150 L740 320 Z" fill="var(--sky-ink, #6f86b8)" opacity=".35"/>
  <!-- 丘 -->
  <ellipse cx="200" cy="350" rx="300" ry="80" fill="var(--leaf, #2f8f6b)" opacity=".8"/>
  <ellipse cx="660" cy="330" rx="260" ry="150" fill="var(--leaf, #2f8f6b)" opacity=".6"/>
  <!-- 旅の道 -->
  <path d="M170 312 C 200 286, 220 274, 250 268 S 320 236, 345 238 S 410 262, 440 256 S 505 226, 535 220 S 600 200, 630 196 S 700 176, 760 160" fill="none" stroke="var(--sun-soft, #fdf0cc)" stroke-width="14" stroke-linecap="round"/>
  <path d="M170 312 C 200 286, 220 274, 250 268 S 320 236, 345 238 S 410 262, 440 256 S 505 226, 535 220 S 600 200, 630 196 S 700 176, 760 160" fill="none" stroke="var(--sun, #f2b01e)" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <!-- 約束の旗（ガーランド） -->
  <path d="M340 26 Q560 64 780 26" fill="none" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linecap="round"/>
  <g stroke="var(--ink, #1d2540)" stroke-width="1.5" stroke-linejoin="round">
    <path d="M370 31 L392 34 L378 52 Z" fill="var(--warm, #c0583a)"/>
    <path d="M410 37 L432 39 L419 57 Z" fill="var(--sun, #f2b01e)"/>
    <path d="M690 39 L712 37 L703 57 Z" fill="var(--sun, #f2b01e)"/>
    <path d="M730 34 L752 31 L744 50 Z" fill="var(--warm, #c0583a)"/>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="470" y="30" width="180" height="36" rx="18" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="560" y="54" font-size="16" fill="#1d2540">🚩 お客様との約束</text>
  </g>
  <!-- 6つの立ち寄り場所 -->
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <g fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2">
      <circle cx="250" cy="268" r="12"/><circle cx="345" cy="238" r="12"/><circle cx="440" cy="256" r="12"/>
      <circle cx="535" cy="220" r="12"/><circle cx="630" cy="196" r="12"/><circle cx="725" cy="168" r="12"/>
    </g>
    <g font-size="12" fill="var(--ink, #1d2540)">
      <text x="250" y="272">1</text><text x="345" y="242">2</text><text x="440" y="260">3</text>
      <text x="535" y="224">4</text><text x="630" y="200">5</text><text x="725" y="172">6</text>
    </g>
    <g fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2">
      <rect x="226" y="226" width="48" height="24" rx="12"/>
      <rect x="301" y="262" width="88" height="24" rx="12"/>
      <rect x="404" y="214" width="72" height="24" rx="12"/>
      <rect x="495" y="244" width="80" height="24" rx="12"/>
      <rect x="586" y="154" width="88" height="24" rx="12"/>
      <rect x="697" y="186" width="56" height="24" rx="12"/>
    </g>
    <g font-size="12" fill="var(--ink, #1d2540)">
      <text x="250" y="243">知る</text><text x="345" y="279">問い合わせる</text><text x="440" y="231">相談する</text>
      <text x="535" y="261">使い始める</text><text x="630" y="171">使いつづける</text><text x="725" y="203">お別れ</text>
    </g>
  </g>
  <!-- くるりん -->
  <g transform="translate(30 150) scale(.9)">
    <g transform="translate(60 62)">
      <g fill="var(--sun, #f2b01e)">
        <rect x="-9" y="-54" width="18" height="22" rx="6"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(45)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(90)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(135)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(180)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(225)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(270)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(315)"/>
      </g>
      <circle r="40" fill="var(--sun, #f2b01e)"/><circle r="31" fill="#ffd866"/>
      <circle cx="-12" cy="-4" r="5" fill="#1d2540"/><circle cx="12" cy="-4" r="5" fill="#1d2540"/>
      <circle cx="-10.5" cy="-6" r="1.8" fill="#fff"/><circle cx="13.5" cy="-6" r="1.8" fill="#fff"/>
      <ellipse cx="-21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/><ellipse cx="21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/>
      <path d="M-9 9 Q0 19 9 9" fill="none" stroke="#1d2540" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
  <!-- 旅のしおり -->
  <g transform="rotate(-8 148 228)">
    <rect x="120" y="198" width="56" height="62" rx="5" fill="var(--surface, #fff)" stroke="#1d2540" stroke-width="2"/>
    <rect x="120" y="198" width="10" height="62" rx="3" fill="var(--warm, #c0583a)"/>
    <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle" font-size="12" fill="#1d2540">
      <text x="153" y="222">旅の</text><text x="153" y="240">しおり</text>
    </g>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <path d="M40 24 h252 a14 14 0 0 1 14 14 v46 a14 14 0 0 1 -14 14 h-200 l-14 14 l-2 -14 h-36 a14 14 0 0 1 -14 -14 v-46 a14 14 0 0 1 14 -14 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="166" y="54" font-size="15" text-anchor="middle" fill="var(--ink, #1d2540)">お客様が通る道を、</text>
    <text x="166" y="80" font-size="15" text-anchor="middle" fill="var(--ink, #1d2540)">出会いからお別れまで歩いてみよう</text>
  </g>
</svg>
