<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="お客様の体験マップ。いちばん上に、マップ全体にかかる「お客様との約束」の旗。その下に旅の道すじのように、知る・問い合わせる・相談する・使い始める・使いつづける・お別れの6つの場面が左から右へ並ぶ。各場面の下に、お客様の目的・心配や気持ち・担当・道具・作業・約束を守る行動の6段が積み重なり、いちばん下の約束を守る行動の段が黄色で目立っている">
