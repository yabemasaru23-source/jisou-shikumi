<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="ケーキ屋さんが、お客様の家の玄関でお誕生日のケーキを手わたしている。ケーキには頼まれていないのに名前入りのプレートとろうそくがついていて、「期待をこえる、ひと手間」の札がかかっている。お客様のまわりにはハートが浮かんでいる。くるりんが「ひと手間が、うれしい！」と言っている">
  <rect width="800" height="320" rx="24" fill="var(--sky, #dbe7fb)"/>
  <!-- くも -->
  <g fill="var(--surface, #fff)" opacity=".85">
    <ellipse cx="150" cy="50" rx="44" ry="15"/><ellipse cx="184" cy="41" rx="28" ry="15"/>
    <ellipse cx="600" cy="40" rx="36" ry="12"/><ellipse cx="626" cy="33" rx="22" ry="12"/>
  </g>
  <!-- 地面 -->
  <path d="M0 262 H800 V296 a24 24 0 0 1 -24 24 H24 a24 24 0 0 1 -24 -24 Z" fill="var(--leaf-soft, #dcf1e8)"/>
  <!-- お客様の家 -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linejoin="round">
    <rect x="600" y="132" width="160" height="130" fill="var(--surface, #fff)"/>
    <path d="M586 136 L680 72 L774 136 Z" fill="var(--warm, #c0583a)"/>
    <rect x="700" y="150" width="40" height="30" rx="4" fill="var(--sun-soft, #fdf0cc)"/>
    <rect x="698" y="196" width="44" height="66" rx="4" fill="var(--sky-ink, #6f86b8)"/>
  </g>
  <circle cx="732" cy="230" r="3" fill="var(--ink, #1d2540)"/>
  <!-- ケーキ屋さん（左）とお客様（右） -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linejoin="round">
    <path d="M404 262 V232 Q404 210 430 210 Q456 210 456 232 V262 Z" fill="var(--leaf, #2f8f6b)"/>
    <circle cx="430" cy="188" r="17" fill="var(--surface, #fff)"/>
    <path d="M414 176 Q430 160 446 176 Z" fill="var(--surface, #fff)"/>
    <path d="M614 262 V232 Q614 210 640 210 Q666 210 666 232 V262 Z" fill="var(--sun, #f2b01e)"/>
    <circle cx="640" cy="188" r="17" fill="var(--surface, #fff)"/>
  </g>
  <g fill="var(--ink, #1d2540)">
    <circle cx="424" cy="187" r="2"/><circle cx="436" cy="187" r="2"/>
    <circle cx="634" cy="187" r="2"/><circle cx="646" cy="187" r="2"/>
  </g>
  <g fill="none" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linecap="round">
    <path d="M425 194 Q430 199 435 194"/><path d="M634 193 Q640 200 646 193"/>
    <!-- 腕 -->
    <path d="M452 224 L498 216" stroke-width="3"/><path d="M618 224 L572 216" stroke-width="3"/>
  </g>
  <!-- ケーキ -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linejoin="round">
    <ellipse cx="535" cy="218" rx="50" ry="7" fill="var(--surface, #fff)"/>
    <rect x="497" y="178" width="76" height="38" rx="6" fill="var(--sun-soft, #fdf0cc)"/>
    <path d="M497 186 Q506 196 516 186 Q525 196 535 186 Q544 196 554 186 Q563 196 573 186" fill="none" stroke="var(--warm, #c0583a)" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="519" y="194" width="32" height="14" rx="3" fill="var(--surface, #fff)" stroke-width="1.5"/>
  </g>
  <g stroke="var(--ink, #1d2540)" stroke-width="1.5">
    <rect x="512" y="162" width="6" height="16" rx="2" fill="var(--sky-ink, #6f86b8)"/>
    <rect x="532" y="162" width="6" height="16" rx="2" fill="var(--warm, #c0583a)"/>
    <rect x="552" y="162" width="6" height="16" rx="2" fill="var(--leaf, #2f8f6b)"/>
  </g>
  <g fill="var(--sun, #f2b01e)">
    <ellipse cx="515" cy="155" rx="3.5" ry="5.5"/><ellipse cx="535" cy="155" rx="3.5" ry="5.5"/><ellipse cx="555" cy="155" rx="3.5" ry="5.5"/>
  </g>
  <!-- ハート -->
  <g fill="var(--warm, #c0583a)">
    <path d="M668 160 c-4 -6 -12 -2 -9 4 l9 9 l9 -9 c3 -6 -5 -10 -9 -4 Z"/>
    <path d="M610 150 c-3 -5 -9 -2 -7 3 l7 7 l7 -7 c2 -5 -4 -8 -7 -3 Z"/>
  </g>
  <!-- ひと手間の札 -->
  <path d="M470 98 L522 146" stroke="var(--ink-soft, #545c78)" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="300" y="56" width="236" height="42" rx="21" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <text x="418" y="83" font-size="16" fill="#1d2540">🎁 期待をこえる、ひと手間</text>
    <text x="535" y="290" font-size="12" fill="var(--ink, #1d2540)">名前入りのプレートと、ろうそく</text>
  </g>
  <!-- くるりん -->
  <g transform="translate(30 180) scale(.9)">
    <g transform="translate(60 62)">
      <g fill="var(--sun, #f2b01e)">
        <rect x="-9" y="-54" width="18" height="22" rx="6"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(45)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(90)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(135)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(180)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(225)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(270)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(315)"/>
      </g>
      <circle r="40" fill="var(--sun, #f2b01e)"/><circle r="31" fill="#ffd866"/>
      <circle cx="-12" cy="-4" r="5" fill="#1d2540"/><circle cx="12" cy="-4" r="5" fill="#1d2540"/>
      <circle cx="-10.5" cy="-6" r="1.8" fill="#fff"/><circle cx="13.5" cy="-6" r="1.8" fill="#fff"/>
      <ellipse cx="-21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/><ellipse cx="21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/>
      <path d="M-9 9 Q0 19 9 9" fill="none" stroke="#1d2540" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <path d="M40 104 h168 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-110 l-14 14 l-2 -14 h-42 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="124" y="138" font-size="15" text-anchor="middle" fill="var(--ink, #1d2540)">ひと手間が、うれしい！</text>
  </g>
</svg>
