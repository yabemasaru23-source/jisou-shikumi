<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="山のてっぺんに夢の完成図、3合目の山小屋に3年後のゴールの旗。くるりんが地図を持って登り口に立っている">
  <rect width="800" height="320" rx="24" fill="var(--sky, #dbe7fb)"/>
  <!-- くも -->
  <g fill="var(--surface, #fff)" opacity=".85">
    <ellipse cx="130" cy="70" rx="46" ry="16"/><ellipse cx="165" cy="60" rx="30" ry="16"/>
    <ellipse cx="620" cy="110" rx="40" ry="13"/><ellipse cx="650" cy="102" rx="26" ry="13"/>
  </g>
  <!-- 奥の山 -->
  <path d="M520 320 L640 150 L780 320 Z" fill="var(--sky-ink, #6f86b8)" opacity=".35"/>
  <!-- 大きな山 -->
  <path d="M180 320 L440 46 L700 320 Z" fill="var(--sky-ink, #6f86b8)" opacity=".75"/>
  <path d="M440 46 L392 97 L412 92 L428 106 L446 90 L462 104 L476 84 Z" fill="var(--surface, #fff)"/>
  <!-- てっぺんの星 -->
  <g transform="translate(440 30)">
    <path d="M0 -18 L5 -6 L18 -5 L8 3 L11 16 L0 9 L-11 16 L-8 3 L-18 -5 L-5 -6 Z" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <rect x="480" y="16" width="176" height="36" rx="18" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="568" y="40" font-size="16" text-anchor="middle" fill="var(--ink, #1d2540)">🏔 会社の夢の完成図</text>
  </g>
  <!-- 登山道 -->
  <path d="M300 318 C 340 290, 300 270, 350 250 S 420 225, 380 205 S 360 170, 405 150 S 470 120, 440 60" fill="none" stroke="var(--surface, #fff)" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round"/>
  <!-- 3合目の山小屋と旗 -->
  <g transform="translate(372 196)">
    <path d="M-28 0 L0 -24 L28 0 Z" fill="var(--warm, #c0583a)"/>
    <rect x="-22" y="0" width="44" height="26" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <rect x="-6" y="10" width="12" height="16" fill="var(--ink, #1d2540)"/>
    <line x1="30" y1="26" x2="30" y2="-40" stroke="var(--ink, #1d2540)" stroke-width="3" stroke-linecap="round"/>
    <path d="M30 -40 L62 -30 L30 -20 Z" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <rect x="452" y="150" width="190" height="52" rx="14" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="547" y="172" font-size="15" text-anchor="middle" fill="#1d2540">🚩 3年後のゴール</text>
    <text x="547" y="192" font-size="12" text-anchor="middle" fill="#1d2540">まずは、ここをめざす</text>
  </g>
  <!-- 手前の丘 -->
  <ellipse cx="160" cy="330" rx="260" ry="60" fill="var(--leaf, #2f8f6b)" opacity=".8"/>
  <ellipse cx="700" cy="340" rx="220" ry="60" fill="var(--leaf, #2f8f6b)" opacity=".6"/>
  <!-- 道しるべ（8つの作戦） -->
  <g font-family="Zen Maru Gothic, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <g transform="translate(318 292)"><circle r="11" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/><text y="4" fill="var(--ink, #1d2540)">1</text></g>
    <g transform="translate(346 252)"><circle r="11" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/><text y="4" fill="var(--ink, #1d2540)">2</text></g>
    <g transform="translate(398 226)"><circle r="11" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/><text y="4" fill="var(--ink, #1d2540)">3</text></g>
  </g>
  <!-- くるりん -->
  <g transform="translate(70 150) scale(1)">
    <g transform="translate(60 62)">
      <g fill="var(--sun, #f2b01e)">
        <rect x="-9" y="-54" width="18" height="22" rx="6"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(45)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(90)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(135)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(180)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(225)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(270)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(315)"/>
      </g>
      <circle r="40" fill="var(--sun, #f2b01e)"/><circle r="31" fill="#ffd866"/>
      <circle cx="-12" cy="-4" r="5" fill="#1d2540"/><circle cx="12" cy="-4" r="5" fill="#1d2540"/>
      <circle cx="-10.5" cy="-6" r="1.8" fill="#fff"/><circle cx="13.5" cy="-6" r="1.8" fill="#fff"/>
      <ellipse cx="-21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/><ellipse cx="21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/>
      <path d="M-9 9 Q0 19 9 9" fill="none" stroke="#1d2540" stroke-width="3.5" stroke-linecap="round"/>
      <!-- 地図 -->
      <g transform="translate(34 18) rotate(-10)">
        <rect x="0" y="0" width="40" height="30" rx="3" fill="var(--surface, #fff)" stroke="#1d2540" stroke-width="2"/>
        <path d="M6 22 L14 10 L22 18 L32 6" fill="none" stroke="var(--warm, #c0583a)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <path d="M40 104 h168 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-110 l-14 14 l-2 -14 h-42 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="124" y="138" font-size="15" text-anchor="middle" fill="var(--ink, #1d2540)">地図があれば、迷わない！</text>
  </g>
</svg>
