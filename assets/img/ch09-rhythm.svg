    <g font-size="13" text-anchor="middle" fill="var(--ink, #1d2540)">
      <text x="251" y="61">4月</text><text x="297" y="61">5月</text><text x="343" y="61">6月</text><text x="389" y="61">7月</text><text x="435" y="61">8月</text><text x="481" y="61">9月</text><text x="527" y="61">10月</text><text x="573" y="61">11月</text><text x="619" y="61">12月</text><text x="665" y="61">1月</text><text x="711" y="61">2月</text><text x="757" y="61">3月</text>
    </g>
