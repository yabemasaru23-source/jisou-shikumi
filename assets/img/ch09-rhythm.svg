    <text x="116" y="132" font-size="12" text-anchor="middle" fill="var(--ink-soft, #545c78)">毎週・60分（社長＋部長）</text>
    <rect x="16" y="158" width="200" height="70" rx="12" fill="var(--leaf-soft, #dcf1e8)" stroke="var(--leaf, #2f8f6b)" stroke-width="2.5"/>
