<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" role="img" aria-label="会社のリズムを1年の時間割で見た図。4月から3月までの12か月に、作戦会議は毎週（実行）、3か月ごとに計画、半年ごとに考える会。拠点長会議は毎月（実行）、1対1の応援面談も毎月（実行）。全員集合ミーティングは4月と10月の年2回で、考えると計画をする。ふだんの会議は「実行する」が中心">
  <defs>
    <g id="c09-week" fill="var(--sun, #f2b01e)"><rect x="8" y="0" width="4" height="16" rx="2"/><rect x="16" y="0" width="4" height="16" rx="2"/><rect x="24" y="0" width="4" height="16" rx="2"/><rect x="32" y="0" width="4" height="16" rx="2"/></g>
    <rect id="c09-do" x="-9" y="-9" width="18" height="18" rx="5" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="1.5"/>
    <path id="c09-plan" d="M0 -10 L10 0 L0 10 L-10 0 Z" fill="var(--sky-ink, #6f86b8)" stroke="var(--ink, #1d2540)" stroke-width="1.5" stroke-linejoin="round"/>
