<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="看板サービスのつくり方。喜ばれる・教えられる・くり返し頼まれるの3つのものさしで点をつけ、合計がいちばん高いものをまず1つ選ぶ。そこに名前・中身・値段・流れ・よくある質問の5つの部品をそろえると、見積もりなしで、誰でも売れて、誰でも届けられる看板サービスになる">
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <!-- 3つのものさし -->
    <g fill="var(--sky, #dbe7fb)" stroke="var(--sky-ink, #6f86b8)" stroke-width="2.5">
      <rect x="70" y="14" width="200" height="66" rx="14"/>
      <rect x="300" y="14" width="200" height="66" rx="14"/>
      <rect x="530" y="14" width="200" height="66" rx="14"/>
    </g>
    <g font-size="17" fill="var(--ink, #1d2540)">
      <text x="170" y="42">😊 喜ばれる</text>
      <text x="400" y="42">📖 教えられる</text>
      <text x="630" y="42">🔁 くり返し頼まれる</text>
    </g>
    <g font-size="12" fill="var(--ink-soft, #545c78)">
      <text x="170" y="66">お客様が心から喜ぶ</text>
      <text x="400" y="66">新人さんにも教えられる</text>
      <text x="630" y="66">何度も、たくさん頼まれる</text>
    </g>
    <g stroke="var(--ink-soft, #545c78)" stroke-width="2.5" stroke-linecap="round" fill="none">
      <path d="M170 82 L320 108"/><path d="M400 82 V106"/><path d="M630 82 L480 108"/>
    </g>
    <!-- まず1つ選ぶ -->
    <rect x="230" y="110" width="340" height="40" rx="20" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <text x="400" y="136" font-size="15" fill="var(--ink, #1d2540)">合計点がいちばん高いものを、まず1つ</text>
    <path d="M400 154 V176" stroke="var(--ink-soft, #545c78)" stroke-width="3" stroke-linecap="round"/>
    <path d="M392 168 L400 178 L408 168" fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 5つの部品 -->
    <rect x="40" y="184" width="720" height="110" rx="16" fill="var(--leaf-soft, #dcf1e8)" stroke="var(--leaf, #2f8f6b)" stroke-width="2"/>
    <text x="400" y="208" font-size="15" fill="var(--ink, #1d2540)">🧩 5つの部品をそろえる</text>
    <g fill="var(--surface, #fff)" stroke="var(--leaf, #2f8f6b)" stroke-width="2">
      <rect x="56" y="220" width="128" height="62" rx="10"/>
      <rect x="196" y="220" width="128" height="62" rx="10"/>
      <rect x="336" y="220" width="128" height="62" rx="10"/>
      <rect x="476" y="220" width="128" height="62" rx="10"/>
      <rect x="616" y="220" width="128" height="62" rx="10"/>
    </g>
    <g font-size="15" fill="var(--ink, #1d2540)">
      <text x="120" y="246">① 名前</text>
      <text x="260" y="246">② 中身</text>
      <text x="400" y="246">③ 値段</text>
      <text x="540" y="246">④ 流れ</text>
      <text x="680" y="246">⑤ よくある質問</text>
    </g>
    <g font-size="11" fill="var(--ink-soft, #545c78)">
      <text x="120" y="268">呼びやすい名前</text>
      <text x="260" y="268">お客様がどうなれるか</text>
      <text x="400" y="268">総額がひと目でわかる</text>
      <text x="540" y="268">5〜7つのステップ</text>
      <text x="680" y="268">誰でも同じ答え</text>
    </g>
    <path d="M400 298 V320" stroke="var(--ink-soft, #545c78)" stroke-width="3" stroke-linecap="round"/>
    <path d="M392 312 L400 322 L408 312" fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 看板サービス -->
    <g stroke="var(--ink, #1d2540)" stroke-width="3" stroke-linecap="round">
      <line x1="250" y1="410" x2="250" y2="426"/><line x1="550" y1="410" x2="550" y2="426"/>
    </g>
    <rect x="200" y="328" width="400" height="82" rx="14" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <text x="400" y="362" font-size="20" fill="#1d2540">⭐ 看板サービス</text>
    <text x="400" y="390" font-size="13" fill="#1d2540">見積もりなしで、誰でも売れて、誰でも届けられる</text>
    <text x="400" y="444" font-size="12" fill="var(--ink-soft, #545c78)">例：「おうち元気プログラム」</text>
  </g>
</svg>
