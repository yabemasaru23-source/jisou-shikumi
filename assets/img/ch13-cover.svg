<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="合言葉のある会社の家の前で、仲間ふたりが手をふって出むかえている。招待状を手にした新しい仲間が「ここで働きたい！」と道を歩いてくる。道のとちゅうには「仲間、募集中」の看板。くるりんが「合う仲間と、出会おう！」と言っている">
  <rect width="800" height="320" rx="24" fill="var(--sky, #dbe7fb)"/>
  <!-- くも -->
  <g fill="var(--surface, #fff)" opacity=".85">
    <ellipse cx="300" cy="56" rx="44" ry="15"/><ellipse cx="332" cy="46" rx="28" ry="15"/>
    <ellipse cx="460" cy="92" rx="34" ry="12"/><ellipse cx="484" cy="85" rx="22" ry="12"/>
  </g>
  <!-- 地面 -->
  <ellipse cx="400" cy="322" rx="400" ry="74" fill="var(--leaf, #2f8f6b)" opacity=".8"/>
  <!-- 道 -->
  <path d="M190 312 C 300 284, 430 270, 600 262" fill="none" stroke="var(--surface, #fff)" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round"/>
  <!-- 会社の家 -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linejoin="round">
    <rect x="540" y="154" width="170" height="104" fill="var(--surface, #fff)"/>
    <path d="M525 154 L625 86 L725 154 Z" fill="var(--warm, #c0583a)"/>
    <rect x="556" y="176" width="30" height="26" rx="3" fill="var(--sky, #dbe7fb)"/>
    <rect x="602" y="200" width="44" height="58" fill="var(--sun-soft, #fdf0cc)"/>
    <path d="M602 200 L584 208 L584 264 L602 258 Z" fill="var(--surface, #fff)"/>
  </g>
  <!-- 看板 -->
  <line x1="625" y1="68" x2="625" y2="86" stroke="var(--ink, #1d2540)" stroke-width="2.5" stroke-linecap="round"/>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="540" y="34" width="170" height="34" rx="17" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="625" y="57" font-size="15" fill="var(--ink, #1d2540)">🤝 合言葉のある会社</text>
  </g>
  <!-- 出むかえる仲間 -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round">
    <path d="M656 258 V238 Q656 216 680 216 Q704 216 704 238 V258 Z" fill="var(--leaf, #2f8f6b)"/>
    <circle cx="680" cy="196" r="16" fill="var(--surface, #fff)"/>
    <path d="M516 258 V238 Q516 216 540 216 Q564 216 564 238 V258 Z" fill="var(--sky-ink, #6f86b8)"/>
    <circle cx="540" cy="196" r="16" fill="var(--surface, #fff)"/>
  </g>
  <g stroke="var(--ink, #1d2540)" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M702 226 L722 204"/><path d="M518 226 L500 204"/>
  </g>
  <g fill="var(--ink, #1d2540)">
    <circle cx="674" cy="194" r="2"/><circle cx="686" cy="194" r="2"/>
    <circle cx="534" cy="194" r="2"/><circle cx="546" cy="194" r="2"/>
  </g>
  <g fill="none" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linecap="round">
    <path d="M675 201 Q680 206 685 201"/><path d="M535 201 Q540 206 545 201"/>
  </g>
  <!-- 新しい仲間 -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round">
    <path d="M404 252 V230 Q404 208 430 208 Q456 208 456 230 V252 Z" fill="var(--sun, #f2b01e)"/>
    <circle cx="430" cy="186" r="17" fill="var(--surface, #fff)"/>
    <rect x="452" y="214" width="30" height="20" rx="2" fill="var(--surface, #fff)"/>
    <path d="M452 214 L467 226 L482 214" fill="none"/>
  </g>
  <g fill="var(--ink, #1d2540)"><circle cx="436" cy="184" r="2"/><circle cx="446" cy="184" r="2"/></g>
  <path d="M435 192 Q440 197 445 192" fill="none" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linecap="round"/>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <path d="M376 118 h140 a17 17 0 0 1 0 34 h-62 l-12 12 l-2 -12 h-64 a17 17 0 0 1 0 -34 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="446" y="141" font-size="15" fill="var(--ink, #1d2540)">ここで働きたい！</text>
  </g>
  <!-- 募集の看板 -->
  <line x1="280" y1="216" x2="280" y2="254" stroke="var(--ink, #1d2540)" stroke-width="3" stroke-linecap="round"/>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="220" y="178" width="120" height="38" rx="10" fill="var(--sun-soft, #fdf0cc)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="280" y="203" font-size="15" fill="#1d2540">仲間、募集中</text>
  </g>
  <!-- くるりん -->
  <g transform="translate(40 180) scale(.9)">
    <g transform="translate(60 62)">
      <g fill="var(--sun, #f2b01e)">
        <rect x="-9" y="-54" width="18" height="22" rx="6"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(45)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(90)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(135)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(180)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(225)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(270)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(315)"/>
      </g>
      <circle r="40" fill="var(--sun, #f2b01e)"/><circle r="31" fill="#ffd866"/>
      <circle cx="-12" cy="-4" r="5" fill="#1d2540"/><circle cx="12" cy="-4" r="5" fill="#1d2540"/>
      <circle cx="-10.5" cy="-6" r="1.8" fill="#fff"/><circle cx="13.5" cy="-6" r="1.8" fill="#fff"/>
      <ellipse cx="-21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/><ellipse cx="21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/>
      <path d="M-9 9 Q0 19 9 9" fill="none" stroke="#1d2540" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <path d="M40 104 h168 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-110 l-14 14 l-2 -14 h-42 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="124" y="138" font-size="15" text-anchor="middle" fill="var(--ink, #1d2540)">合う仲間と、出会おう！</text>
  </g>
</svg>
