<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="宝さがしの流れ。1 いまの仕事を書き出す、2 仕組み一覧表、3 直す順番を決める、4 8つの直し方で直す、5 ためして仕事のレシピにする。未来の作戦マップの仕組みも2に合流する。全体を、集める・選ぶ・知らせる・レシピに残すをくり返す改善を続けるチームの輪が囲んでいる">
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <!-- 改善を続けるチームの輪 -->
    <rect x="40" y="40" width="720" height="460" rx="30" fill="none" stroke="var(--leaf, #2f8f6b)" stroke-width="3" stroke-dasharray="8 8"/>
    <g fill="none" stroke="var(--leaf, #2f8f6b)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M214 32 L224 40 L214 48"/><path d="M576 32 L586 40 L576 48"/>
      <path d="M752 262 L760 272 L768 262"/>
      <path d="M410 492 L400 500 L410 508"/>
      <path d="M32 278 L40 268 L48 278"/>
    </g>
    <g font-size="14">
      <rect x="80" y="26" width="80" height="28" rx="14" fill="var(--leaf-soft, #dcf1e8)" stroke="var(--leaf, #2f8f6b)" stroke-width="2"/><text x="120" y="45" fill="var(--ink, #1d2540)">集める</text>
      <rect x="620" y="26" width="80" height="28" rx="14" fill="var(--leaf-soft, #dcf1e8)" stroke="var(--leaf, #2f8f6b)" stroke-width="2"/><text x="660" y="45" fill="var(--ink, #1d2540)">選ぶ</text>
      <rect x="610" y="486" width="100" height="28" rx="14" fill="var(--leaf-soft, #dcf1e8)" stroke="var(--leaf, #2f8f6b)" stroke-width="2"/><text x="660" y="505" fill="var(--ink, #1d2540)">知らせる</text>
      <rect x="80" y="486" width="120" height="28" rx="14" fill="var(--leaf-soft, #dcf1e8)" stroke="var(--leaf, #2f8f6b)" stroke-width="2"/><text x="140" y="505" fill="var(--ink, #1d2540)">レシピに残す</text>
    </g>
    <rect x="285" y="22" width="230" height="36" rx="18" fill="var(--surface, #fff)" stroke="var(--leaf, #2f8f6b)" stroke-width="2.5"/>
    <text x="400" y="46" font-size="16" fill="var(--ink, #1d2540)">🔁 改善を続けるチーム</text>
    <!-- ① と 作戦マップ -->
    <rect x="80" y="70" width="300" height="56" rx="14" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <text x="230" y="94" font-size="16" fill="var(--ink, #1d2540)">① いまの仕事を書き出す</text>
    <text x="230" y="114" font-size="12" fill="var(--ink-soft, #545c78)">現場から・会社全体の流れから</text>
    <rect x="420" y="70" width="300" height="56" rx="28" fill="var(--sky, #dbe7fb)" stroke="var(--sky-ink, #6f86b8)" stroke-width="2.5"/>
    <text x="570" y="94" font-size="16" fill="var(--ink, #1d2540)">🗺 未来の作戦マップの仕組み</text>
    <text x="570" y="114" font-size="12" fill="var(--ink-soft, #545c78)">作戦ごとの仕組み（第6章）</text>
    <!-- 矢印 -->
    <g fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M230 128 L330 144"/><path d="M320 136 L330 144 L318 150"/>
      <path d="M570 128 L470 144"/><path d="M480 136 L470 144 L482 150"/>
      <path d="M400 212 V228"/><path d="M393 220 L400 228 L407 220"/>
      <path d="M400 322 V338"/><path d="M393 330 L400 338 L407 330"/>
      <path d="M400 394 V410"/><path d="M393 402 L400 410 L407 402"/>
    </g>
    <!-- ② -->
    <rect x="220" y="150" width="360" height="60" rx="14" fill="var(--sun, #f2b01e)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <text x="400" y="176" font-size="16" fill="#1d2540">② 仕組み一覧表</text>
    <text x="400" y="198" font-size="12" fill="#1d2540">大・中・小に分けて、◯△✕をつける</text>
    <!-- ③ -->
    <rect x="120" y="232" width="560" height="88" rx="14" fill="var(--sun-soft, #fdf0cc)" stroke="var(--sun, #f2b01e)" stroke-width="2.5"/>
    <text x="400" y="258" font-size="16" fill="var(--ink, #1d2540)">③ 直す順番を決める</text>
    <g font-size="12">
      <rect x="141" y="272" width="96" height="32" rx="10" fill="var(--surface, #fff)" stroke="var(--warm, #c0583a)" stroke-width="2"/><text x="189" y="293" fill="var(--ink, #1d2540)">🔥 火を消す</text>
      <rect x="245" y="272" width="170" height="32" rx="10" fill="var(--surface, #fff)" stroke="var(--warm, #c0583a)" stroke-width="2"/><text x="330" y="293" fill="var(--ink, #1d2540)">🧯 火が起きないようにする</text>
      <rect x="423" y="272" width="120" height="32" rx="10" fill="var(--surface, #fff)" stroke="var(--sun, #f2b01e)" stroke-width="2"/><text x="483" y="293" fill="var(--ink, #1d2540)">😊 お客様への効果</text>
      <rect x="551" y="272" width="108" height="32" rx="10" fill="var(--surface, #fff)" stroke="var(--sun, #f2b01e)" stroke-width="2"/><text x="605" y="293" fill="var(--ink, #1d2540)">💰 会社への効果</text>
    </g>
    <!-- ④ -->
    <rect x="220" y="342" width="360" height="50" rx="14" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2.5"/>
    <text x="400" y="373" font-size="16" fill="var(--ink, #1d2540)">④ 8つの直し方で直す</text>
    <!-- ⑤ -->
    <rect x="200" y="414" width="400" height="52" rx="26" fill="var(--leaf-soft, #dcf1e8)" stroke="var(--leaf, #2f8f6b)" stroke-width="2.5"/>
    <text x="400" y="446" font-size="16" fill="var(--ink, #1d2540)">⑤ ためして「仕事のレシピ」に 📒</text>
  </g>
</svg>
