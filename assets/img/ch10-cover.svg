<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="自転車の練習。上司がうしろの荷台からそっと手をはなし、部下がひとりで自転車をこぎ出している。前には1から7までの階段があり、てっぺんに旗が立っている。くるりんが「少しずつ、手をはなそう！」と言っている">
  <rect width="800" height="320" rx="24" fill="var(--sky, #dbe7fb)"/>
  <!-- くも -->
  <g fill="var(--surface, #fff)" opacity=".85">
    <ellipse cx="150" cy="56" rx="44" ry="15"/><ellipse cx="184" cy="47" rx="28" ry="15"/>
    <ellipse cx="640" cy="64" rx="38" ry="12"/><ellipse cx="668" cy="57" rx="24" ry="12"/>
  </g>
  <!-- 看板 -->
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <rect x="295" y="16" width="210" height="36" rx="18" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="400" y="40" font-size="16" fill="var(--ink, #1d2540)">🚲 自転車の練習と同じ</text>
  </g>
  <!-- 丘 -->
  <ellipse cx="400" cy="316" rx="470" ry="58" fill="var(--leaf, #2f8f6b)" opacity=".8"/>
  <!-- 7つの段階の階段 -->
  <g fill="var(--sun-soft, #fdf0cc)" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round">
    <rect x="600" y="248" width="24" height="52"/><rect x="624" y="238" width="24" height="62"/><rect x="648" y="228" width="24" height="72"/><rect x="672" y="218" width="24" height="82"/><rect x="696" y="208" width="24" height="92"/><rect x="720" y="198" width="24" height="102"/>
    <rect x="744" y="188" width="24" height="112" fill="var(--sun, #f2b01e)"/>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700" text-anchor="middle">
    <g font-size="11">
      <text x="612" y="259" fill="var(--ink, #1d2540)">1</text><text x="636" y="259" fill="var(--ink, #1d2540)">2</text><text x="660" y="259" fill="var(--ink, #1d2540)">3</text><text x="684" y="259" fill="var(--ink, #1d2540)">4</text><text x="708" y="259" fill="var(--ink, #1d2540)">5</text><text x="732" y="259" fill="var(--ink, #1d2540)">6</text><text x="756" y="259" fill="#1d2540">7</text>
    </g>
    <text x="650" y="196" font-size="13" fill="var(--ink, #1d2540)">7つの段階</text>
  </g>
  <line x1="756" y1="188" x2="756" y2="136" stroke="var(--ink, #1d2540)" stroke-width="3" stroke-linecap="round"/>
  <path d="M756 136 L782 146 L756 156 Z" fill="var(--warm, #c0583a)" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round"/>
  <!-- 上司 -->
  <g stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linejoin="round">
    <path d="M384 262 V234 Q384 208 410 208 Q436 208 436 234 V262 Z" fill="var(--sky-ink, #6f86b8)"/>
    <circle cx="410" cy="186" r="18" fill="var(--surface, #fff)"/>
  </g>
  <g fill="var(--ink, #1d2540)"><circle cx="404" cy="184" r="2"/><circle cx="416" cy="184" r="2"/></g>
  <path d="M405 191 Q410 196 415 191" fill="none" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linecap="round"/>
  <g stroke="var(--ink, #1d2540)" stroke-linecap="round" fill="none">
    <line x1="432" y1="222" x2="454" y2="206" stroke-width="3"/>
    <circle cx="456" cy="205" r="4" fill="var(--surface, #fff)" stroke-width="2"/>
  </g>
  <!-- 手をはなした合図 -->
  <g fill="none" stroke="var(--ink-soft, #545c78)" stroke-width="2" stroke-linecap="round">
    <path d="M465 194 Q469 202 465 210"/><path d="M473 194 Q477 202 473 210"/>
  </g>
  <!-- 自転車 -->
  <g fill="none" stroke="var(--ink, #1d2540)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="480" cy="236" r="26" stroke-width="3" fill="var(--surface, #fff)" fill-opacity=".5"/>
    <circle cx="560" cy="236" r="26" stroke-width="3" fill="var(--surface, #fff)" fill-opacity=".5"/>
    <path d="M480 236 L505 200 L548 200 L515 236 Z M505 200 L515 236 M548 200 L560 236 M548 200 L544 186 L556 184" stroke="var(--warm, #c0583a)" stroke-width="4"/>
  </g>
  <rect x="496" y="192" width="18" height="6" rx="3" fill="var(--ink, #1d2540)"/>
  <!-- 部下 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M506 196 L525 214 L515 236" stroke="var(--sky-ink, #6f86b8)" stroke-width="7"/>
    <path d="M507 190 L522 160" stroke="var(--leaf, #2f8f6b)" stroke-width="13"/>
    <path d="M522 166 L552 185" stroke="var(--leaf, #2f8f6b)" stroke-width="6"/>
  </g>
  <circle cx="527" cy="142" r="15" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
  <g fill="var(--ink, #1d2540)"><circle cx="525" cy="140" r="2"/><circle cx="535" cy="140" r="2"/></g>
  <path d="M526 147 Q531 151 536 147" fill="none" stroke="var(--ink, #1d2540)" stroke-width="2" stroke-linecap="round"/>
  <!-- くるりん -->
  <g transform="translate(40 180) scale(.9)">
    <g transform="translate(60 62)">
      <g fill="var(--sun, #f2b01e)">
        <rect x="-9" y="-54" width="18" height="22" rx="6"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(45)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(90)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(135)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(180)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(225)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(270)"/><rect x="-9" y="-54" width="18" height="22" rx="6" transform="rotate(315)"/>
      </g>
      <circle r="40" fill="var(--sun, #f2b01e)"/><circle r="31" fill="#ffd866"/>
      <circle cx="-12" cy="-4" r="5" fill="#1d2540"/><circle cx="12" cy="-4" r="5" fill="#1d2540"/>
      <circle cx="-10.5" cy="-6" r="1.8" fill="#fff"/><circle cx="13.5" cy="-6" r="1.8" fill="#fff"/>
      <ellipse cx="-21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/><ellipse cx="21" cy="8" rx="6" ry="4" fill="#f4845f" opacity=".55"/>
      <path d="M-9 9 Q0 19 9 9" fill="none" stroke="#1d2540" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>
  <g font-family="Zen Maru Gothic, sans-serif" font-weight="700">
    <path d="M40 104 h168 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-110 l-14 14 l-2 -14 h-42 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" fill="var(--surface, #fff)" stroke="var(--ink, #1d2540)" stroke-width="2"/>
    <text x="124" y="138" font-size="15" text-anchor="middle" fill="var(--ink, #1d2540)">少しずつ、手をはなそう！</text>
  </g>
</svg>
